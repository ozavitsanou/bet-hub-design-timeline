0px;\n  padding: 9px 16px;\n  font-size: 12px;\n  font-weight: 700;\n  cursor: pointer;\n}\n\n/* ── Group feed cards ── */\n.group-feed-card {\n  background: var(--bg-lowest);\n  border: 1.5px solid var(--bg-medium);\n  border-radius: 14px;\n  padding: 14px;\n  margin-bottom: 12px;\n}\n.group-feed-card:last-child { margin-bottom: 0; }\n\n.gfc-author-row {\n  display: flex;\n  align-items: center;\n  gap: 9px;\n  margin-bottom: 10px;\n}\n.gfc-avatar {\n  width: 32px;\n  height: 32px;\n  border-radius: 50%;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  font-size: 11px;\n  font-weight: 800;\n  color: var(--bg-lowest);\n  flex-shrink: 0;\n}\n.gfc-author-info {\n  flex: 1;\n  display: flex;\n  flex-direction: column;\n  gap: 1px;\n}\n.gfc-author-name {\n  font-size: 12px;\n  font-weight: 700;\n  color: var(--text-default);\n}\n.gfc-time {\n  font-size: 10px;\n  color: var(--text-disabled);\n}\n.gfc-type-badge {\n  font-size: 10px;\n  font-weight: 700;\n  padding: 3px 8px;\n  border-radius: 8px;\n}\n.gfc-type--acca { background: color-mix(in srgb, var(--c-blue-15) 45%, white); color: var(--c-blue-30); }\n.gfc-type--bb   { background: color-mix(in srgb, var(--c-purple-25) 12%, white); color: var(--c-purple-25); }\n\n.gfc-note {\n  font-size: 12px;\n  color: var(--text-muted);\n  font-style: italic;\n  margin: 0 0 10px;\n  line-height: 1.5;\n}\n\n.gfc-bet-block {\n  background: var(--bg-low);\n  border-radius: 10px;\n  padding: 11px 12px;\n  margin-bottom: 10px;\n}\n.gfc-bet-header {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  margin-bottom: 8px;\n}\n.gfc-bet-title {\n  font-size: 12px;\n  font-weight: 700;\n  color: var(--text-default);\n}\n.gfc-odds {\n  font-size: 14px;\n  font-weight: 800;\n  color: var(--c-blue-25);\n}\n.gfc-legs {\n  list-style: none;\n  padding: 0;\n  margin: 0;\n  display: flex;\n  flex-direction: column;\n  gap: 4px;\n}\n.gfc-leg {\n  font-size: 11px;\n  color: var(--text-muted);\n  padding-left: 10px;\n  position: relative;\n}\n.gfc-leg::before {\n  content: '·';\n  position: absolute;\n  left: 0;\n  color: var(--text-disabled);\n}\n\n.gfc-actions {\n  display: flex;\n  gap: 6px;\n}\n.gfc-btn {\n  flex: 1;\n  border: none;\n  border-radius: 8px;\n  padding: 8px 4px;\n  font-size: 11px;\n  font-weight: 600;\n  cursor: pointer;\n  transition: all 0.15s;\n}\n.gfc-btn--copy   { background: var(--bg-layout); color: var(--text-subtle); }\n.gfc-btn--modify { background: color-mix(in srgb, var(--c-purple-25) 12%, white); color: var(--c-purple-25); }\n.gfc-btn--add    { background: var(--text-default); color: var(--bg-lowest); }\n.gfc-btn--copied { background: var(--c-emerald-25) !important; color: var(--bg-lowest) !important; }\n\n\n/* ═══════════════ KDS layer — Kaizen Gaming Design System ═══════════════ */\n\n/* Display type: Betano Nichrome, always uppercase */\n.section-title, #hub-header-title, .bs-header-title, .mood-sheet-title,\n.edit-card-title, .acca-title, .discover-empty-title, .sp-player-name {\n  font-family: var(--font-display);\n  font-weight: 500;\n  text-transform: uppercase;\n  letter-spacing: 0.01em;\n}\n#hub-header-title { font-size: 20px; line-height: 24px; }\n.bs-header-title, .edit-card-title, .mood-sheet-title { font-size: 20px; line-height: 24px; }\n\n/* Odds are display numerals */\n.acca-total-odds, .meb-header-odds, .sp-odds, .odds-enhanced, .bs-footer-odds,\n.gfc-odds, .bs-bet-odds, .leg-odds, .meb-event-odds, .alt-odds, .odds-original {\n  font-variant-numeric: tabular-nums;\n}\n.acca-total-odds { background: var(--bg-primary); border-radius: var(--radius-pill); }\n.acca-header { background: var(--c-gray-75); }\n\n/* Buttons — KDS radius 12, primary orange CTAs */\n.add-to-betslip, .bb-edit-btn, .edit-confirm-btn, .mood-apply, .bs-bet-now, .discover-restart {\n  border-radius: var(--radius-12px);\n  transition: background var(--dur-fast) var(--ease-standard), color var(--dur-fast) var(--ease-standard), border-color var(--dur-fast) var(--ease-standard);\n}\n.mood-apply, .edit-confirm-btn {\n  background: var(--bg-primary);\n}\n.mood-apply:hover, .edit-confirm-btn:hover { background: var(--bg-primary-hover); opacity: 1; }\n.bs-bet-now.ready { background: var(--bg-secondary); }\n.bs-bet-now.ready:hover { background: var(--bg-secondary-hover); }\n.view-all-btn { color: var(--text-link); font-weight: 500; }\n.view-all-btn:hover { color: var(--text-link-hover); }\n\n/* Cards */\n.bet-card { border-radius: var(--radius-12px); box-shadow: var(--shadow-sm); }\n.story-card { border-radius: var(--radius-16px); box-shadow: var(--shadow-sm); }\n\n/* Story cards — KDS brand surfaces (gradient only on the primary surface) */\n.story-card--discovery { background: linear-gradient(145deg, var(--c-orange-25) 0%, var(--c-orange-30) 100%); border: none; }\n.story-card--discovery .story-card-icon { animation: none; text-shadow: none; color: #fff; }\n.story-card--tournament { background: var(--c-denim-25); }\n.story-card--offer { background: var(--c-emerald-30); }\n.story-card--social { background: var(--c-gray-70); }\n.story-card-icon { color: #fff; display: flex; align-items: center; justify-content: center; }\n.story-card-label { text-shadow: none; }\n\n/* Icons */\n.kds-icon { display: inline-block; vertical-align: -2px; flex-shrink: 0; }\n.filter-pill .kds-icon, .scope-chip .kds-icon { vertical-align: -2.5px; }\n.filter-pill-arrow { display: inline-flex; align-items: center; }\n.leg-sport-icon { color: #fff; }\n.bs-bet-icon { color: var(--text-muted); display: flex; margin-top: 2px; }\n.bs-icon-btn, .hub-close-btn { display: flex; align-items: center; justify-content: center; }\n.discover-action-btn span { display: flex; align-items: center; justify-content: center; }\n.mood-option { padding-left: 18px; }\n\n/* Chips / segmented — pill geometry per KDS */\n.hub-mode-switch { border-radius: var(--radius-pill); }\n.mode-seg { border-radius: var(--radius-pill); }\n.bs-tabs { border-radius: var(--radius-12px); }\n\n/* Betslip pill uses primary brand fill */\n.bs-pill { background: var(--bg-primary); }\n.bs-pill:hover { background: var(--bg-primary-hover); }\n\n/* Disclaimers */\n.kds-disclaimer {\n  font-size: var(--t-micro); line-height: var(--t-micro-lh);\n  color: var(--text-muted); text-align: center; padding: 16px 0 4px;\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n  \n\n  <!-- ── Layout wrapper ── -->\n  <div class=\"prototype-layout\">\n\n  <!-- ── Host Page ── -->\n  <div class=\"host-page\">\n\n    <!-- Homepage Touchpoint -->\n    <div class=\"touchpoint-label\">Homepage touchpoint<\u002Fdiv>\n\n    <!-- Story cards row -->\n    <div class=\"story-row\">\n      <div class=\"story-card story-card--discovery\" onclick=\"openHub('all', 'discover')\">\n        <div class=\"story-card-icon\"><svg class=\"kds-icon\" width=\"26\" height=\"26\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 20 20.000\" fill=\"none\">\n  <path d=\"M 2.222 8.889 C 2.222 5.212 5.212 2.222 8.889 2.222 C 12.565 2.222 15.555 5.212 15.555 8.889 C 15.555 12.565 12.565 15.555 8.889 15.555 C 5.212 15.555 2.222 12.565 2.222 8.889 Z M 19.674 18.103 L 15.902 14.33 C 17.072 12.825 17.778 10.94 17.778 8.889 C 17.778 3.988 13.79 0 8.889 0 C 3.988 0 0 3.988 0 8.889 C 0 13.79 3.988 17.778 8.889 17.778 C 10.94 17.778 12.825 17.072 14.33 15.902 L 18.103 19.674 C 18.32 19.891 18.604 20 18.889 20 C 19.173 20 19.458 19.891 19.674 19.674 C 20.109 19.24 20.109 18.538 19.674 18.103 Z\" fill=\"currentColor\" fill-rule=\"evenodd\"><\u002Fpath>\n  <path d=\"M 2.222 8.889 C 2.222 5.212 5.212 2.222 8.889 2.222 C 12.565 2.222 15.555 5.212 15.555 8.889 C 15.555 12.565 12.565 15.555 8.889 15.555 C 5.212 15.555 2.222 12.565 2.222 8.889 Z M 19.674 18.103 L 15.902 14.33 C 17.072 12.825 17.778 10.94 17.778 8.889 C 17.778 3.988 13.79 0 8.889 0 C 3.988 0 0 3.988 0 8.889 C 0 13.79 3.988 17.778 8.889 17.778 C 10.94 17.778 12.825 17.072 14.33 15.902 L 18.103 19.674 C 18.32 19.891 18.604 20 18.889 20 C 19.173 20 19.458 19.891 19.674 19.674 C 20.109 19.24 20.109 18.538 19.674 18.103 Z\" fill=\"currentColor\" fill-rule=\"evenodd\"><\u002Fpath>\n<\u002Fsvg><\u002Fdiv>\n        <div class=\"story-card-label\">Bet<br>Discovery<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"story-card story-card--tournament\">\n        <div class=\"story-card-icon\"><svg class=\"kds-icon\" width=\"26\" height=\"26\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 20 20\" fill=\"none\">\n  <path d=\"M 16 0 L 4 0 C 1.79 0 0 1.79 0 4 L 0 16 C 0 18.21 1.79 20 4 20 L 16 20 C 18.21 20 20 18.21 20 16 L 20 4 C 20 1.79 18.21 0 16 0 Z M 18 16 C 18 17.1 17.1 18 16 18 L 4 18 C 2.9 18 2 17.1 2 16 L 2 4 C 2 2.9 2.9 2 4 2 L 16 2 C 17.1 2 18 2.9 18 4 L 18 16 Z\" fill=\"currentColor\" fill-rule=\"nonzero\"><\u002Fpath>\n  <path d=\"M 6 7 C 5.45 7 5 7.45 5 8 L 5 15 C 5 15.55 5.45 16 6 16 C 6.55 16 7 15.55 7 15 L 7 8 C 7 7.45 6.55 7 6 7 Z\" fill=\"currentColor\" fill-rule=\"nonzero\"><\u002Fpath>\n  <path d=\"M 10 4 C 9.45 4 9 4.45 9 5 L 9 15 C 9 15.55 9.45 16 10 16 C 10.55 16 11 15.55 11 15 L 11 5 C 11 4.45 10.55 4 10 4 Z\" fill=\"currentColor\" fill-rule=\"nonzero\"><\u002Fpath>\n  <path d=\"M 14 10 C 13.45 10 13 10.45 13 11 L 13 15 C 13 15.55 13.45 16 14 16 C 14.55 16 15 15.55 15 15 L 15 11 C 15 10.45 14.55 10 14 10 Z\" fill=\"currentColor\" fill-rule=\"nonzero\"><\u002Fpath>\n<\u002Fsvg><\u002Fdiv>\n        <div class=\"story-card-label\">Sports<br>Tournament<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"story-card story-card--offer\">\n        <div class=\"story-card-icon\"><svg class=\"kds-icon\" width=\"26\" height=\"26\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 18 20\" fill=\"none\">\n  <path d=\"M 14.615 5.062 C 14.853 4.59 15 4.064 15 3.5 C 15 1.57 13.43 0 11.5 0 C 10.521 0 9.636 0.403 9 1.053 C 8.364 0.403 7.479 0 6.5 0 C 4.57 0 3 1.57 3 3.5 C 3 4.064 3.147 4.59 3.385 5.062 C 1.472 5.361 0 7.005 0 9 L 0 16 C 0 18.206 1.794 20 4 20 L 14 20 C 16.206 20 18 18.206 18 16 L 18 9 C 18 7.005 16.528 5. 9 19.239 15.679 19.875 11.602 C 20.378 8.374 19.356 5.213 17.071 2.928 Z\" fill=\"currentColor\" fill-rule=\"evenodd\"><\u002Fpath>\n  <path d=\"M 14 10.999 C 13.448 10.999 13 10.551 13 9.999 C 13 9.447 13.448 8.999 14 8.999 C 14.552 8.999 15 9.447 15 9.999 C 15 10.551 14.552 10.999 14 10.999 Z M 10 10.999 C 9.448 10.999 9 10.551 9 9.999 C 9 9.447 9.448 8.999 10 8.999 C 10.552 8.999 11 9.447 11 9.999 C 11 10.551 10.552 10.999 10 10.999 Z M 6 10.999 C 5.448 10.999 5 10.551 5 9.999 C 5 9.447 5.448 8.999 6 8.999 C 6.552 8.999 7 9.447 7 9.999 C 7 10.551 6.552 10.999 6 10.999 Z M 17.071 2.928 C 14.787 0.644 11.626 -0.375 8.397 0.124 C 4.32 0.76 0.94 4.044 0.177 8.111 C -0.19 10.069 0.021 12.063 0.788 13.876 C 0.886 14.106 0.916 14.322 0.877 14.515 L 0.02 18.803 C -0.046 19.131 0.057 19.47 0.293 19.706 C 0.482 19.895 0.737 19.999 1 19.999 C 1.065 19.999 1.131 19.993 1.196 19.979 L 5.479 19.123 C 5.725 19.076 5.964 19.145 6.123 19.211 C 7.937 19.978 9.931 20.188 11.888 19.822 C 15.955 19.059 19.239 15.679 19.875 11.602 C 20.378 8.374 19.356 5.213 17.071 2.928 Z\" fill=\"currentColor\" fill-rule=\"evenodd\"><\u002Fpath>\n<\u002Fsvg><\u002Fdiv>\n        <div class=\"story-card-label\">B Social<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"carousel-section\">\n      <div class=\"section-header\">\n        <span class=\"section-title\">Trending Accas<\u002Fspan>\n        <button class=\"view-all-btn\" onclick=\"openHub('accumulator', 'homepage')\">See More in Bet Hub →<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"carousel-preview\" id=\"acca-preview\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- League Touchpoint -->\n    <div class=\"touchpoint-label\">League touchpoint <span class=\"touchpoint-context\">World Cup<\u002Fspan><\u002Fdiv>\n    <div class=\"carousel-section\">\n      <div class=\"section-header\">\n        <span class=\"section-title\">Multi-Match Builders<\u002Fspan>\n        <button class=\"view-all-btn\" onclick=\"openHub('multiEventBuilder', 'league')\">See More in Bet Hub →<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"carousel-preview\" id=\"meb-preview\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Event-Details Touchpoint -->\n    <div class=\"touchpoint-label\">Event-details touchpoint <span class=\"touchpoint-context\">World Cup<\u002Fspan><\u002Fdiv>\n    <div class=\"carousel-section\">\n      <div class=\"section-header\">\n        <span class=\"section-title\">Prime Picks<\u002Fspan>\n        <button class=\"view-all-btn\" onclick=\"openHub('betBuilder', 'event')\">See More in Bet Hub →<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"carousel-preview\" id=\"bb-preview\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"kds-disclaimer\">18+ | Gamble responsibly<\u002Fdiv>\n\n  <\u002Fdiv><!-- end host-page -->\n\n  <!-- ── Documentation Panel ── -->\n  <div class=\"doc-panel\">\n    <div class=\"doc-header\">\n      <div class=\"doc-tabs\">\n        <button class=\"doc-tab doc-tab--active\" onclick=\"switchDocTab('notes', this)\">Notes<\u002Fbutton>\n        <button class=\"doc-tab\" onclick=\"switchDocTab('why', this)\">Why Now?<\u002Fbutton>\n        <button class=\"doc-tab\" onclick=\"switchDocTab('mvp', this)\">MVP<\u002Fbutton>\n      <\u002Fdiv>\n      <span class=\"doc-version\">Bet Hub v0.1<\u002Fspan>\n    <\u002Fdiv>\n\n    <!-- ── Tab: Prototype Notes ── -->\n    <div id=\"doc-tab-notes\" class=\"doc-tab-pane\">\n\n    <div class=\"doc-section\">\n      <div class=\"doc-section-tag tag--browse\">Browse<\u002Fdiv>\n      <h3 class=\"doc-section-title\">Browse Mode<\u002Fh3>\n      <p class=\"doc-section-body\">Default landing when opening from any carousel touchpoint. Automatically pre-filters from the context of the touchpoint (sport, competition, or event).<\u002Fp>\n      <p class=\"doc-section-body\">The vertical scroll will provide more content on the same event if they came from an event page, then suggest accumulator and multi-event builder cards. Filters can be removed to access the full site catalogue across sports.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"doc-section\">\n      <div class=\"doc-section-tag tag--discover\">Discover<\u002Fdiv>\n      <h3 class=\"doc-section-title\">Discover Mode<\u002Fh3>\n      <p class=\"doc-section-body\">Opt-in swipe experience accessible via the Browse/Discover toggle. Always draws from the full catalogue across all sports and card types — context-free serendipity.<\u002Fp>\n      <p class=\"doc-section-body\">Swipe right → Add to betslip. Swipe left → Pass. No filters shown — intentionally distraction-free. The algorithm surfaces cards based on user history and moment.<\u002Fp>\n      <p class=\"doc-section-body doc-section-body--highlight\">The whole point is to provide users with a personalised feed that will serve them the most relevant content for them.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"doc-section\">\n      <div class=\"doc-section-tag tag--filters\">Filters<\u002Fdiv>\n      <h3 class=\"doc-section-title\">Filter Carousel<\u002Fh3>\n      <p class=\"doc-section-body\">Single horizontally scrollable row: <strong>Scope chip<\u002Fstrong> (sport → competition, pre-set by entry context) + <strong>Bet Type<\u002Fstrong> dropdown + <strong>Odds<\u002Fstrong> persona bottom sheet + <strong>Offers<\u002Fstrong> toggle.<\u002Fp>\n      <p class=\"doc-section-body\">Filters are hidden in Discover mode. \"Clear filters\" appears as a second-row pill when any filter is active, disappears in Discover.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"doc-section\">\n      <div class=\"doc-section-tag tag--touchpoints\">Touchpoints<\u002Fdiv>\n      <h3 class=\"doc-section-title\">Entry Touchpoints<\u002Fh3>\n      <ul class=\"doc-list\">\n        <li><strong>Homepage<\u002Fstrong> — Opens Browse, All Sports (no pre-filter). Full catalogue available.<\u002Fli>\n        <li><strong>League page<\u002Fstrong> — Opens Browse, pre-filtered to that competition (e.g. World Cup). Sport chip is pre-set and active.<\u002Fli>\n        <li><strong>Event-details page<\u002Fstrong> — Opens Browse, pre-filtered to the competition of that event. Native event cards shown first, then broader content as user scrolls.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n\n    <div class=\"doc-section\">\n      <div class=\"doc-section-tag tag--cards\">Card Types<\u002Fdiv>\n      <h3 class=\"doc-section-title\">Card Types<\u002Fh3>\n      <ul class=\"doc-list\">\n        <li><strong>Accumulator<\u002Fstrong> — Multi-leg, single or multi-sport. Header shows leg count + odds.<\u002Fli>\n        <li><strong>Bet Builder<\u002Fstrong> — Multiple markets on a single event. Enhancement % shown when applicable.<\u002Fli>\n        <li><strong>Multi-Event Builder<\u002Fstrong> — Bet builder legs spanning multiple events. Header shows event count.<\u002Fli>\n      <\u002Ful>\n      <p class=\"doc-section-body\">Card labels: <strong>Enhanced Odds<\u002Fstrong> (prev/new price), <strong>ACCA Bonus<\u002Fstrong> (winnings boost, % by leg count), <strong>BB Boost<\u002Fstrong> (qualifies for offer), <strong>Built for You<\u002Fstrong> (AI-personalised, with reason).<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"doc-section\">\n      <div class=\"doc-section-tag tag--betslip\">Betslip<\u002Fdiv>\n      <h3 class=\"doc-section-title\">Betslip Flow<\u002Fh3>\n      <p class=\"doc-section-body\">Floating bar slides up from the bottom on first selection. Count + combined odds update live. Tap to open the full betslip sheet.<\u002Fp>\n      <p class=\"doc-section-body\">Betslip supports Single / Multiple / System tabs. BB Boost cards trigger an inline boost toggle with requirement chips. Stake input + BET NOW CTA.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"doc-section\">\n      <div class=\"doc-section-tag tag--odds\">Odds Filter<\u002Fdiv>\n      <h3 class=\"doc-section-title\">Odds Personas<\u002Fh3>\n      <ul class=\"doc-list\">\n        <li><strong>Just surprise me<\u002Fstrong> — All odds, full catalogue<\u002Fli>\n        <li><strong>Conservative<\u002Fstrong> — Odds 0–2.0<\u002Fli>\n        <li><strong>Balanced<\u002Fstrong> — Odds 5–15<\u002Fli>\n        <li><strong>Adventurous<\u002Fstrong> — Odds 15–40<\u002Fli>\n        <li><strong>High Roller<\u002Fstrong> — Odds 40+<\u002Fli>\n      <\u002Ful>\n      <p class=\"doc-section-body\">Greyed out when no builds available in that range for current scope.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- Card examples -->\n    <div class=\"doc-section\">\n      <div class=\"doc-section-tag tag--cards\">Examples<\u002Fdiv>\n      <h3 class=\"doc-section-title\">Accumulator Cards<\u002Fh3>\n      <div class=\"doc-card-examples\" id=\"doc-acca-examples\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"doc-section\">\n      <div class=\"doc-section-tag tag--cards\">Examples<\u002Fdiv>\n      <h3 class=\"doc-section-title\">Bet Builder Cards<\u002Fh3>\n      <div class=\"doc-card-examples\" id=\"doc-bb-examples\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"doc-section\">\n      <div class=\"doc-section-tag tag--cards\">Examples<\u002Fdiv>\n      <h3 class=\"doc-section-title\">Multi-Event Builder Cards<\u002Fh3>\n      <div class=\"doc-card-examples\" id=\"doc-meb-examples\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <\u002Fdiv><!-- end doc-tab-notes -->\n\n    <!-- ── Tab: Why Now? ── -->\n    <div id=\"doc-tab-why\" class=\"doc-tab-pane\" style=\"display:none\">\n\n      <div class=\"why-section\">\n        <div class=\"why-tag\">Context<\u002Fdiv>\n        <h3 class=\"why-title\">The Shift Happening Now<\u002Fh3>\n        <p class=\"why-body\">Players are moving away from singles. Accumulators and Multi-Match Combos (MCC) are growing. As bet complexity increases, so does decision-making friction — more legs, more uncertainty, longer time to placing a bet.<\u002Fp>\n        <p class=\"why-body\">Two distinct personas are emerging: <strong>High-intent players<\u002Fstrong> who know what they want and go straight to Search or Co-pilot. And <strong>Explorers<\u002Fstrong> who want to browse, get inspired, and discover what's available.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"why-section why-section--data\">\n        <div class=\"why-tag why-tag--data\">Data · Jan–Jun 2026 vs 2025<\u002Fdiv>\n        <h3 class=\"why-title\">Bet Type Share Shift<\u002Fh3>\n\n        <!-- Bar chart -->\n        <div class=\"why-chart\">\n          <div class=\"why-chart-row\">\n            <span class=\"why-chart-label\">Accumulator<\u002Fspan>\n            <div class=\"why-chart-bar-wrap\">\n              <div class=\"why-chart-bar why-chart-bar--acca\" style=\"width:91%\"><\u002Fdiv>\n              <span class=\"why-chart-value\">54.4%<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"why-chart-row\">\n            <span class=\"why-chart-label\">MCC<\u002Fspan>\n            <div class=\"why-chart-bar-wrap\">\n              <div class=\"why-chart-bar why-chart-bar--mcc\" style=\"width:34%\"><\u002Fdiv>\n              <span class=\"why-chart-value why-chart-value--up\">20.4% <span class=\"why-delta\">▲ +4.2pp<\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"why-chart-row\">\n            <span class=\"why-chart-label\">Single<\u002Fspan>\n            <div class=\"why-chart-bar-wrap\">\n              <div class=\"why-chart-bar why-chart-bar--single\" style=\"width:33%\"><\u002Fdiv>\n              <span class=\"why-chart-value why-chart-value--down\">19.5% <span class=\"why-delta why-delta--down\">▼ −3.6pp<\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"why-chart-row\">\n            <span class=\"why-chart-label\">Bet Builder<\u002Fspan>\n            <div class=\"why-chart-bar-wrap\">\n              <div class=\"why-chart-bar why-chart-bar--bb\" style=\"width:9%\"><\u002Fdiv>\n              <span class=\"why-chart-value\">5.6%<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"why-footnote\">Share of total bets placed, Jan 1 – Jun 3<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"why-section\">\n        <div class=\"why-tag why-tag--problem\">The Problem<\u002Fdiv>\n        <h3 class=\"why-title\">Content Exists — But It's Scattered<\u002Fh3>\n        <p class=\"why-body\">We're producing great pre-built content: Trending Accas, Boosted Bet Builders, Personalised cards. But they live independently across Homepage, League, Sport, Event and For You — with no unified destination.<\u002Fp>\n        <p class=\"why-body\">An Explorer landing on the homepage today has to browse through many components, surface pre-made bets one at a time, with no coherent experience connecting them.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"why-section\">\n        <div class=\"why-tag why-tag--vision\">Our Approach<\u002Fdiv>\n        <h3 class=\"why-title\">A Natural Evolution, Not a New Silo<\u002Fh3>\n        <p class=\"why-body\">Bet Hub merges existing components and functionalities into a single destination. It doesn't reinvent — it consolidates what already drives results: Trending ACCAs, Bet Builder cards, Multi-Match Combo builds, personalised picks.<\u002Fp>\n        <p class=\"why-body\">We're growing trending and personalised content in parallel, both delivering results, both serving different personas. Bet Hub gives both streams a home that makes sense.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"why-section why-section--nsm\">\n        <div class=\"why-tag why-tag--nsm\">Success Metrics<\u002Fdiv>\n        <h3 class=\"why-title\">What We're Measuring<\u002Fh3>\n        <ul class=\"why-nsm-list\">\n          <li>\n            <div>\n              <strong>Pre-built card AtB share<\u002Fstrong>\n              <span>Increase % of bets placed that originate from a pre-built card<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fli>\n          <li>\n            <div>\n              <strong>Engagement rate vs. baseline<\u002Fstrong>\n              <span>Cards opened, swiped, or added to betslip vs. carousel impressions<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fli>\n          <li>\n            <div>\n              <strong>Time to first AtB<\u002Fstrong>\n              <span>Reduce average session time from entry to bet placement<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fli>\n          <li>\n            <div>\n              <strong>Ease of use (CSAT)<\u002Fstrong>\n              <span>Increase satisfaction for ACCA, Bet Builder, and MCC journeys<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fli>\n          <li>\n            <div>\n              <strong>Complex bet share vs. singles<\u002Fstrong>\n              <span>Grow the share of MCC and ACCA vs. singles across the platform<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n\n    <\u002Fdiv><!-- end doc-tab-why -->\n\n    <!-- ── Tab: MVP ── -->\n    <div id=\"doc-tab-mvp\" class=\"doc-tab-pane\" style=\"display:none\">\n\n      <div class=\"why-section\">\n        <div class=\"why-tag why-tag--mvp\">Scope<\u002Fdiv>\n        <h3 class=\"why-title\">MVP: Browse Mode<\u002Fh3>\n        <p class=\"why-body\">The MVP focuses entirely on Browse — a unified destination users reach either from a \"See More in Bet Hub\" CTA on an existing carousel, or from the Bet Hub touchpoint on the Homepage.<\u002Fp>\n        <p class=\"why-body\">Discover mode, advanced personalisation signals, and a unified ranking engine are post-MVP. The goal here is to validate the destination concept and prove engagement with consolidated content.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"why-section\">\n        <div class=\"why-tag why-tag--existing\">What We Already Have<\u002Fdiv>\n        <h3 class=\"why-title\">Existing Building Blocks<\u002Fh3>\n        <ul class=\"mvp-building-blocks\">\n          <li class=\"mvp-block mvp-block--available\">\n            <span class=\"mvp-block-status\"><\u002Fspan>\n            <div>\n              <strong>Accumulator cards<\u002Fstrong>\n              <span>Multi-leg, multi-sport. Already surfaced in Trending Accas carousel.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fli>\n          <li class=\"mvp-block mvp-block--available\">\n            <span class=\"mvp-block-status\"><\u002Fspan>\n            <div>\n              <strong>Bet Builder cards<\u002Fstrong>\n              <span>Single-event, up to 3 legs. Live on Homepage, League, Sport, Event-details.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fli>\n          <li class=\"mvp-block mvp-block--partial\">\n            <span class=\"mvp-block-status\">~<\u002Fspan>\n            <div>\n              <strong>Personalised Bet Builders<\u002Fstrong>\n              <span>Exists but scoped to the For You page. Not yet surfaced in Browse flow.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fli>\n          <li class=\"mvp-block mvp-block--new\">\n            <span class=\"mvp-block-status\">+<\u002Fspan>\n            <div>\n              <strong>Multi-Match Combo (MCC) card<\u002Fstrong>\n              <span>New card type to build. Bet Builder legs spanning multiple events.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fli>\n          <li class=\"mvp-block mvp-block--explore\">\n            <span class=\"mvp-block-status\">?<\u002Fspan>\n            <div>\n              <strong>More legs on Trending &amp; Personalised Bet Builders<\u002Fstrong>\n              <span>Currently capped at 3 legs. To explore: unlocking 4+ legs for both trending and personalised BB cards to increase complexity and odds appeal.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n\n      <div class=\"why-section\">\n        <div class=\"why-tag why-tag--mvp\">Entry Points &amp; Content<\u002Fdiv>\n        <h3 class=\"why-title\">Browse Experience by Touchpoint<\u002Fh3>\n\n        <div class=\"mvp-touchpoint\">\n          <div class=\"mvp-tp-header\">\n            <strong>Homepage → \"See More Trending\"<\u002Fstrong>\n          <\u002Fdiv>\n          <ul class=\"mvp-tp-list\">\n            <li>Full catalogue of Trending Accas<\u002Fli>\n            <li>Introduce MCC cards in the all-view mix<\u002Fli>\n            <li>Personalised Bet Builders blended in<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n\n        <div class=\"mvp-touchpoint\">\n          <div class=\"mvp-tp-header\">\n            <strong>League page → \"See More in Bet Hub\"<\u002Fstrong>\n          <\u002Fdiv>\n          <ul class=\"mvp-tp-list\">\n            <li>Pre-filtered to that competition<\u002Fli>\n            <li>Accumulators + MCC cards on the same league<\u002Fli>\n            <li>Personalised cards relevant to competition blended in<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n\n        <div class=\"mvp-touchpoint\">\n          <div class=\"mvp-tp-header\">\n            <strong>Event-details → \"See More in Bet Hub\"<\u002Fstrong>\n          <\u002Fdiv>\n          <ul class=\"mvp-tp-list\">\n            <li>Cards specific to that event shown first<\u002Fli>\n            <li>Then: pre-filtered Accas + MCC on the same league<\u002Fli>\n            <li>Personalised Bet Builders introduced here as a new touchpoint<\u002Fli>\n            <li>Broadens to full catalogue as user scrolls<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"why-section\">\n        <div class=\"why-tag why-tag--openq\">Open Question<\u002Fdiv>\n        <h3 class=\"why-title\">Ranking: Personalisation vs. Trending<\u002Fh3>\n        <p class=\"why-body\">When personalised Bet Builders and Trending cards share the same Browse feed, we need a way to decide order. Two initial approaches to explore:<\u002Fp>\n        <ul class=\"mvp-options\">\n          <li>\n            <span class=\"mvp-opt-label\">Option A<\u002Fspan>\n            <div>\n              <strong>Pinned \"Picked for you\" section<\u002Fstrong>\n              <span>Personalised cards sit in a distinct pinned block at the top; trending feed below. Clear separation, no blending needed.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fli>\n          <li>\n            <span class=\"mvp-opt-label\">Option B<\u002Fspan>\n            <div>\n              <strong>Interleaved relevance score<\u002Fstrong>\n              <span>A single ranked feed combining personalisation signal + popularity score. Better experience, but requires a scoring model — likely Phase 2.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fli>\n        <\u002Ful>\n        <p class=\"why-body\" style=\"margin-top:10px\">Recommendation for MVP: <strong>Option A<\u002Fstrong>. Ship the destination fast; defer unified scoring to Phase 2.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"why-section\">\n        <div class=\"why-tag why-tag--nsm\">MVP Success Signal<\u002Fdiv>\n        <h3 class=\"why-title\">What We Want to Prove<\u002Fh3>\n        <ul class=\"why-nsm-list\">\n          <li>\n            <div>\n              <strong>Destination stickiness<\u002Fstrong>\n              <span>Users who open Browse scroll past the fold and engage with &gt;1 card<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fli>\n          <li>\n            <div>\n              <strong>MCC card adoption<\u002Fstrong>\n              <span>AtB rate on Multi-Match Combo cards vs. existing card types<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fli>\n          <li>\n            <div>\n              <strong>Cross-touchpoint reach<\u002Fstrong>\n              <span>Users entering via League or Event-details explore beyond their entry context<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n\n    <\u002Fdiv><!-- end doc-tab-mvp -->\n\n  <\u002Fdiv><!-- end doc-panel -->\n\n  <\u002Fdiv><!-- end prototype-layout -->\n\n  <!-- ── Modal Overlay ── -->\n  <div id=\"modal-overlay\"><\u002Fdiv>\n\n  <!-- ── Bet Hub Modal ── -->\n  <div id=\"bet-hub-modal\">\n    <div class=\"modal-handle\"><\u002Fdiv>\n\n    <div class=\"hub-header\">\n      <div class=\"hub-header-left\">\n        <span id=\"hub-header-title\">Trending Accas<\u002Fspan>\n        <span id=\"hub-card-count\">6 picks<\u002Fspan>\n      <\u002Fdiv>\n      <button class=\"hub-close-btn\" onclick=\"BetHubModal.close()\"><svg class=\"kds-icon\" width=\"15\" height=\"15\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M6 6l12 12M18 6L6 18\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n    <\u002Fdiv>\n\n    <div class=\"hub-mode-switch\" id=\"hub-mode-switch\">\n      <button id=\"btn-browse\" class=\"mode-seg active\" onclick=\"BetHubModal.setMode('browse')\">\n        Browse\n      <\u002Fbutton>\n      <button id=\"btn-discover\" class=\"mode-seg\" onclick=\"BetHubModal.setMode('discover')\">\n        Discover\n      <\u002Fbutton>\n      <button id=\"btn-groups\" class=\"mode-seg\" onclick=\"BetHubModal.setMode('groups')\">\n        Bet Groups\n      <\u002Fbutton>\n    <\u002Fdiv>\n\n    <div class=\"hub-filter-carousel\" id=\"hub-filter-carousel\">\n      <button class=\"scope-chip\" id=\"scope-chip\" onclick=\"ScopeSheet.open()\">\n        <span class=\"scope-chip-label\">All Sports<\u002Fspan>\n        <span class=\"filter-pill-arrow\"><svg class=\"kds-icon\" width=\"12\" height=\"12\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M 4 8.601 C 4 8.191 4.157 7.781 4.469 7.469 C 5.094 6.844 6.106 6.844 6.731 7.469 L 12.02 12.758 L 17.289 7.669 C 17.926 7.056 18.939 7.074 19.552 7.709 C 20.164 8.346 20.147 9.359 19.513 9.972 L 13.113 16.151 C 12.484 16.758 11.487 16.75 10.869 16.132 L 4.469 9.732 C 4.157 9.42 4 9.01 4 8.601\"><\u002Fpath>< "MoodSheet.close()\"><\u002Fdiv>\n  <div id=\"mood-sheet\">\n    <div class=\"mood-sheet-handle\"><\u002Fdiv>\n    <h3 class=\"mood-sheet-title\">Odds<\u002Fh3>\n    <div class=\"mood-options\">\n      <button class=\"mood-option\" data-mood=\"surprise\" data-min=\"0\" data-max=\"9999\" onclick=\"MoodSheet.select(this)\">\n        <div class=\"mood-text\">\n          <span class=\"mood-name\">Just surprise me<\u002Fspan>\n          <span class=\"mood-desc\">Available builds: <span class=\"mood-count\">–<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <span class=\"mood-range\">All odds<\u002Fspan>\n        <span class=\"mood-check\"><svg class=\"kds-icon\" width=\"16\" height=\"16\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n      <\u002Fbutton>\n      <button class=\"mood-option\" data-mood=\"conservative\" data-min=\"0\" data-max=\"5\" onclick=\"MoodSheet.select(this)\">\n        <div class=\"mood-text\">\n          <span class=\"mood-name\">Conservative<\u002Fspan>\n          <span class=\"mood-desc\">Available builds: <span class=\"mood-count\">–<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <span class=\"mood-range\">Odds 0–5<\u002Fspan>\n        <span class=\"mood-check\"><svg class=\"kds-icon\" width=\"16\" height=\"16\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n      <\u002Fbutton>\n      <button class=\"mood-option\" data-mood=\"balanced\" data-min=\"5\" data-max=\"15\" onclick=\"MoodSheet.select(this)\">\n        <div class=\"mood-text\">\n          <span class=\"mood-name\">Balanced<\u002Fspan>\n          <span class=\"mood-desc\">Available builds: <span class=\"mood-count\">–<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <span class=\"mood-range\">Odds 5–15<\u0

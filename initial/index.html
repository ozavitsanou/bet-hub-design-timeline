document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  /* container.medium.default  */\n  --bg-medium-hover:       #E2E8F8;   /* container.medium.hovered  */\n  --bg-medium-active:      #D1D9EB;   /* container.medium.active   */\n\n  /* Brand fills — sem.color.bg.primary / secondary */\n  --bg-primary:            #FF3C00;   /* bg.primary.default    */\n  --bg-primary-hover:      #DB3300;   /* bg.primary.hovered    */\n  --bg-primary-active:     #992400;   /* bg.primary.active     */\n  --bg-primary-subtle:     #FFDDD1;   /* bg.primary.pale       */\n  --bg-secondary:          #37A25C;   /* bg.secondary.default  */\n  --bg-secondary-hover:    #2D864C;   /* bg.secondary.hovered  */\n  --bg-secondary-active:   #27523A;   /* bg.secondary.active   */\n  --bg-secondary-subtle:   #D0F0DB;   /* bg.secondary.pale     */\n\n  /* Text — sem.color.text.* */\n  --text-default:          #151923;   /* text.gray.emphasis    */\n  --text-subtle:           #2A3346;   /* text.gray.strong      */\n  --text-muted:            #526789;   /* text.gray.subtle      */\n  --text-disabled:         #60739F;   /* text.disabled         */\n  --text-inverse:          #FFFFFF;   /* text.gray.inverted    */\n  --text-primary:          #DB3300;   /* text.primary          */\n  --text-secondary:        #2D864C;   /* text.secondary        */\n  --text-highlight:        #3A7824;   /* text.highlight        */\n  --text-headline:         #FF3C00;   /* text.headline         */\n  --text-link:             #DB3300;   /* text.link.default     */\n  --text-link-hover:       #992400;   /* text.link.hovered     */\n  --text-danger:           #B90909;   /* text.red              */\n  --text-success:          #107030;   /* text.green            */\n  --text-warning:          #574B05;   /* text.yellow           */\n\n  /* Borders — sem.color.border.* */\n  --border-default:        #C2CEE5;   /* border.dialog         */\n  --border-subtle:         #EAEEFB;   /* border.section        */\n  --border-strong:         #A9B9D1;   /* border.gray.bold      */\n  --border-focus:          #154FC1;   /* border.focused        */\n  --border-disabled:       #DBE5F5;   /* border.disabled       */\n\n  /* Overlays — sem.color.overlay.absolute.black.* */\n  --overlay-strong:        rgba(9,13,21,0.70);  /* overlay.absolute.black.bold   */\n  --overlay-medium:        rgba(9,13,21,0.50);  /* overlay.absolute.black.medium */\n  --overlay-soft:          rgba(9,13,21,0.20);  /* overlay.absolute.black.low    */\n\n  /* ===== Radii (Figma border scale) ===== */\n  --radius-2px: 2px;    /* inputs inner, chips inner */\n  --radius-4px: 4px;    /* tiny buttons, tags */\n  --radius-8px: 8px;    /* inputs, cards inner */\n  --radius-12px: 12px;   /* cards, panels */\n  --radius-16px: 16px;   /* hero cards, dialogs */\n  --radius-24px: 24px;  /* feature cards */\n  --radius-32px: 32px;  /* large panels */\n  --radius-pill: 9999px;\n\n  /* ===== Spacing (8px grid; Figma global/dimension/*x) ===== */\n  --space-0: 0;      --space-px: 1px;\n  --space-0-25: 2px; --space-0-5: 4px;   --space-0-75: 6px;\n  --space-1:   8px;  --space-1-25: 10px; --space-1-5: 12px;\n  --space-1-75: 14px;--space-2: 16px;    --space-2-5: 20px;\n  --space-3:   24px; --space-3-5: 28px;  --space-4: 32px;\n  --space-5:   40px; --space-6:   48px;  --space-7: 56px;\n  --space-8:   64px; --space-9:   72px;  --space-10: 80px;\n  --space-12:  96px; --space-16: 128px;\n\n  /* ===== Shadows (positive = drop, negative = inner) ===== */\n  --shadow-none:  0 0 0 0 rgba(21,25,35,0.10);\n  --shadow-xs:    1px 4px 4px 0 rgba(21,25,35,0.10);\n  --shadow-sm:    0 4px 5px 0 rgba(21,25,35,0.10);\n  --shadow-md:    0 4px 8px 0 rgba(21,25,35,0.10);\n  --shadow-lg:    0 6px 12px 0 rgba(21,25,35,0.10);\n  --shadow-xl:    0 8px 16px 0 rgba(21,25,35,0.10);\n  --shadow-2xl:   0 16px 32px 0 rgba(21,25,35,0.10);\n  --shadow-3xl:   0 24px 36px 0 rgba(21,25,35,0.10);\n  --shadow-4xl:   0 32px 40px 0 rgba(21,25,35,0.10);\n  --shadow-huge:  0 48px 64px 0 rgba(21,25,35,0.10);\n\n  --shadow-inner-xs:   inset 0 4px 4px 0 rgba(21,25,35,0.10);\n  --shadow-inner-sm:   inset 0 4px 8px 0 rgba(21,25,35,0.10);\n  --shadow-inner-md:   inset 0 6px 12px 0 rgba(21,25,35,0.10);\n  --shadow-inner-lg:   inset 0 8px 16px 0 rgba(21,25,35,0.10);\n\n  /* ===== Typography — base ===== */\n  --font-ui:       'Ubuntu', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;\n  --font-display:  'Betano Nichrome', 'MD Nichrome', 'Ubuntu', system-ui, sans-serif;\n\n  /* Heading tokens (display / UPPERCASE) */\n  --h1-size: 32px; --h1-lh: 36px;\n  --h2-size: 24px; --h2-lh: 32px;\n  --h3-size: 20px; --h3-lh: 24px;\n  --h4-size: 18px; --h4-lh: 24px;\n  --h5-size: 16px; --h5-lh: 20px;\n  --h6-size: 14px; --h6-lh: 18px;\n\n  /* Body / UI text tokens */\n  --t-micro:   11px; --t-micro-lh:  14px;\n  --t-tiny:    12px; --t-tiny-lh:   16px;\n  --t-xs:      13px; --t-xs-lh:     18px;\n  --t-sm:      14px; --t-sm-lh:     20px;\n  --t-body:    16px; --t-body-lh:   24px;\n  --t-lg:      20px; --t-lg-lh:     30px;\n\n  /* ===== Motion ===== */\n  --ease-standard: cubic-bezier(0.2, 0, 0, 1);  /* @kind other */\n  --ease-accel:    cubic-bezier(0.3, 0, 1, 1);  /* @kind other */\n  --ease-decel:    cubic-bezier(0, 0, 0.2, 1);  /* @kind other */\n  --dur-fast:   120ms;  /* @kind other */\n  --dur-base:   200ms;  /* @kind other */\n  --dur-slow:   320ms;  /* @kind other */\n}\n\n/* ============ Semantic tokens — DARK mode ============ */\n/* TS source: kds/sem/dark.json (Betano theme)          */\n[data-theme=\"dark\"], .kds-dark {\n  /* Backgrounds */\n  --bg-layout:             #090915;   /* bg.layout              */\n  --bg-section:            #151923;   /* bg.section             */\n  --bg-inner-section:      #0E1320;   /* bg.inner-section       */\n  --bg-dialog:             #1A202D;   /* bg.dialog              */\n  --bg-dialog-alt:         #090915;   /* bg.dialog-alt          */\n  --bg-disabled:           #41506C;   /* bg.disabled            */\n  --bg-tooltip:            #343F56;   /* bg.tooltip             */\n  --bg-tooltip-alt:        #FFFFFF;   /* bg.tooltip-alt         */\n\n  /* Container elevation tiers */\n  --bg-lowest:             #212536;   /* container.lowest.default  */\n  --bg-lowest-hover:       #242A3D;   /* container.lowest.hovered  */\n  --bg-lowest-active:      #2A3046;   /* container.lowest.active   */\n  --bg-low:                #2A3046;   /* container.low.default     */\n  --bg-low-hover:          #2D374D;   /* container.low.hovered     */\n  --bg-low-active:         #343F56;   /* container.low.active      */\n  --bg-medium:             #2D374D;   /* container.medium.default  */\n  --bg-medium-hover:       #343F56;   /* container.medium.hovered  */\n  --bg-medium-active:      #3B4863;   /* container.medium.active   */\n\n  /* Brand fills */\n  --bg-primary:            #FF3C00;   /* bg.primary.default    */\n  --bg-primary-hover:      #DB3300;   /* bg.primary.hovered    */\n  --bg-primary-active:     #992400;   /* bg.primary.active     */\n  --bg-primary-subtle:     #4E0404;   /* bg.primary.pale       */\n  --bg-secondary:          #37A25C;   /* bg.secondary.default  */\n  --bg-secondary-hover:    #2D864C;   /* bg.secondary.hovered  */\n  --bg-secondary-active:   #27523A;   /* bg.secondary.active   */\n  --bg-secondary-subtle:   #153822;   /* bg.secondary.pale     */\n\n  /* Text */\n  --text-default:          #F5F7FA;   /* text.gray.emphasis    */\n  --text-subtle:           #CFD9ED;   /* text.gray.strong      */\n  --text-muted:            #C0CCE7;   /* text.gray.subtle      */\n  --text-disabled:         #A5B3CF;   /* text.disabled         */\n  --text-inverse:          #0F121A;   /* text.gray.inverted    */\n  --text-primary:          #FF825C;   /* text.primary          */\n  --text-secondary:        #77D490;   /* text.secondary        */\n  --text-highlight:        #A3D369;   /* text.highlight        */\n  --text-headline:         #FF3C00;   /* text.headline         */\n  --text-link:             #FF825C;   /* text.link.default     */\n  --text-link-hover:       #FFDDD1;   /* text.link.hovered     */\n  --text-danger:           #FB9D9D;   /* text.red              */\n  --text-success:          #79D297;   /* text.green            */\n  --text-warning:          #F6DE55;   /* text.yellow           */\n\n  /* Borders */\n  --border-default:        #2D374D;   /* border.dialog         */\n  --border-subtle:         #212536;   /* border.section        */\n  --border-strong:         #4D5E80;   /* border.gray.bold      */\n  --border-focus:          #3F99F3;   /* border.focused        */\n  --border-disabled:       #41506C;   /* border.disabled       */\n\n  /* Overlays — same absolute values as light */\n  --overlay-strong:        rgba(9,13,21,0.70);\n  --overlay-medium:        rgba(9,13,21,0.50);\n  --overlay-soft:          rgba(9,13,21,0.20);\n}\n\n/* ============ Semantic element styles ============ */\nhtml, body { background: var(--bg-layout); color: var(--text-default); }\nbody { font-family: var(--font-ui); font-size: var(--t-body); line-height: var(--t-body-lh); -webkit-font-smoothing: antialiased; }\n\nh1,h2,h3,h4,h5,h6 { font-family: var(--font-display); font-weight: 700; color: var(--text-default); text-transform: uppercase; letter-spacing: 0; margin: 0; }\nh1 { font-size: var(--h1-size); line-height: var(--h1-lh); }\nh2 { font-size: var(--h2-size); line-height: var(--h2-lh); }\nh3 { font-size: var(--h3-size); line-height: var(--h3-lh); }\nh4 { font-size: var(--h4-size); line-height: var(--h4-lh); }\nh5 { font-size: var(--h5-size); line-height: var(--h5-lh); }\nh6 { font-size: var(--h6-size); line-height: var(--h6-lh); }\n\np        { margin: 0 0 var(--space-1-5); }\nsmall    { font-size: var(--t-tiny); line-height: var(--t-tiny-lh); color: var(--text-muted); }\ncode, pre{ font-family: var(--font-mono); font-size: var(--t-sm); }\na        { color: var(--text-link); text-decoration: none; }\na:hover  { text-decoration: underline; }\nhr       { border: 0; border-top: 1px solid var(--border-default); margin: var(--space-2) 0; }\n\n/* UI utility classes */\n.kds-heading-1 { font: 700 var(--h1-size)/var(--h1-lh) var(--font-display); text-transform: uppercase; }\n.kds-heading-2 { font: 700 var(--h2-size)/var(--h2-lh) var(--font-display); text-transform: uppercase; }\n.kds-body      { font: 400 var(--t-body)/var(--t-body-lh) var(--font-ui); }\n.kds-body-bold { font: 700 var(--t-body)/var(--t-body-lh) var(--font-ui); }\n.kds-small     { font: 400 var(--t-sm)/var(--t-sm-lh) var(--font-ui); }\n.kds-small-bold{ font: 700 var(--t-sm)/var(--t-sm-lh) var(--font-ui); }\n.kds-tiny      { font: 400 var(--t-tiny)/var(--t-tiny-lh) var(--font-ui); }\n.kds-micro     { font: 500 var(--t-micro)/var(--t-micro-lh) var(--font-ui); letter-spacing: 0.02em; }\n\n/* Scrollbar polish matching the neutral scale */\n::-webkit-scrollbar { width: 10px; height: 10px; }\n::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: var(--radius-pill); }\n::-webkit-scrollbar-track { background: transparent; }\n<\u002Fstyle>\n  <style>/* ─── Reset & Base ─────────────────────────────────────────── */\n*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\n\nbody {\n  font-family: var(--font-ui);\n  background: var(--bg-layout);\n  color: var(--text-default);\n  min-height: 100vh;\n}\n\n/* ─── Prototype Layout (side by side) ─────────────────────── */\n.prototype-layout {\n  display: flex;\n  flex-direction: row;\n  align-items: flex-start;\n  gap: 0;\n  min-height: 100vh;\n  width: 100%;\n  background: var(--bg-medium);\n}\n\n/* ─── Documentation Panel ──────────────────────────────────── */\n.doc-panel {\n  width: 400px;\n  min-width: 400px;\n  flex-shrink: 0;\n  background: var(--bg-lowest);\n  border-left: none;\n  margin-left: 24px;\n  border-radius: 12px;\n  min-height: calc(100vh - 48px);\n  position: sticky;\n  top: 24px;\n  overflow-y: auto;\n  max-height: calc(100vh - 48px);\n  padding-bottom: 40px;\n  order: 2;\n  align-self: flex-start;\n  margin-top: 24px;\n  box-shadow: 0 2px 16px rgba(0,0,0,0.08);\n}\n\n.doc-header {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  padding: 20px 20px 16px;\n  border-bottom: 1px solid var(--border-default);\n  position: sticky;\n  top: 0;\n  background: var(--bg-lowest);\n  z-index: 1;\n}\n\n.doc-title {\n  font-size: 15px;\n  font-weight: 800;\n  color: var(--text-default);\n}\n\n.doc-version {\n  font-size: 11px;\n  font-weight: 600;\n  color: var(--text-disabled);\n  background: var(--bg-layout);\n  padding: 3px 8px;\n  border-radius: 10px;\n}\n\n.doc-section {\n  padding: 18px 20px;\n  border-bottom: 1px solid var(--bg-layout);\n}\n\n.doc-section:last-child { border-bottom: none; }\n\n.doc-section-tag {\n  display: inline-block;\n  font-size: 10px;\n  font-weight: 800;\n  text-transform: uppercase;\n  letter-spacing: 0.6px;\n  padding: 3px 9px;\n  border-radius: 10px;\n  margin-bottom: 8px;\n}\n\n.tag--browse    { background: color-mix(in srgb, var(--c-blue-15) 45%, white); color: var(--c-blue-30); }\n.tag--discover  { background: color-mix(in srgb, var(--c-emerald-10) 55%, white); color: var(--c-emerald-25); }\n.tag--filters   { background: color-mix(in srgb, var(--c-yellow-15) 45%, white); color: var(--c-amber-30); }\n.tag--touchpoints { background: var(--c-orange-10); color: var(--c-orange-25); }\n.tag--cards     { background: color-mix(in srgb, var(--c-purple-25) 12%, white); color: var(--c-purple-25); }\n.tag--betslip   { background: color-mix(in srgb, var(--c-emerald-10) 55%, white); color: var(--c-emerald-30); }\n.tag--odds      { background: color-mix(in srgb, var(--c-amber-15) 45%, white); color: var(--c-amber-30); }\n\n.doc-section-title {\n  font-size: 13px;\n  font-weight: 700;\n  color: var(--text-default);\n  margin-bottom: 8px;\n}\n\n.doc-section-body {\n  font-size: 12px;\n  color: var(--text-muted);\n  line-height: 1.6;\n  margin-bottom: 6px;\n}\n\n.doc-section-body:last-child { margin-bottom: 0; }\n\n.doc-section-body--highlight {\n  background: color-mix(in srgb, var(--c-emerald-10) 55%, white);\n  border-left: 3px solid var(--c-emerald-25);\n  border-radius: 0 6px 6px 0;\n  padding: 8px 10px;\n  color: var(--text-default);\n  font-style: italic;\n  font-weight: 500;\n}\n\n.doc-list {\n  list-style: none;\n  padding: 0;\n  margin: 0;\n  display: flex;\n  flex-direction: column;\n  gap: 5px;\n  margin-bottom: 6px;\n}\n\n.doc-list li {\n  font-size: 12px;\n  color: var(--text-muted);\n  line-height: 1.5;\n  padding-left: 10px;\n  position: relative;\n}\n\n.doc-list li::before {\n  content: '·';\n  position: absolute;\n  left: 0;\n  color: var(--text-disabled);\n}\n\n/* Doc panel card examples — scaled down slightly */\n.doc-card-examples {\n  display: flex;\n  flex-direction: column;\n  gap: 12px;\n  margin-top: 10px;\n  transform-origin: top left;\n  transform: scale(0.85);\n  width: calc(100% / 0.85);\n}\n\n/* ─── Host Page ────────────────────────────────────────────── */\n.host-page {\n  width: 390px;\n  min-width: 390px;\n  max-width: 390px;\n  flex-shrink: 0;\n  padding: 24px 16px;\n  order: 1;\n  background: var(--bg-layout);\n  box-shadow: 4px 0 24px rgba(0,0,0,0.12);\n  position: relative;\n  z-index: 1;\n  min-height: 100vh;\n}\n\n/* ─── Story Cards Row ──────────────────────────────────────── */\n.story-row {\n  display: flex;\n  gap: 10px;\n  margin-bottom: 20px;\n  overflow-x: auto;\n  scrollbar-width: none;\n  -webkit-overflow-scrolling: touch;\n}\n\n.story-row::-webkit-scrollbar { display: none; }\n\n.story-card {\n  flex-shrink: 0;\n  width: 90px;\n  height: 110px;\n  border-radius: 16px;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: flex-end;\n  padding: 10px 8px;\n  cursor: pointer;\n  position: relative;\n  overflow: hidden;\n  transition: transform 0.15s, box-shadow 0.15s;\n  box-shadow: 0 4px 14px rgba(0,0,0,0.15);\n  user-select: none;\n}\n\n.story-card:hover { transform: scale(1.03); box-shadow: 0 6px 18px rgba(0,0,0,0.2); }\n.story-card:active { transform: scale(0.97); }\n\n.story-card-icon {\n  position: absolute;\n  top: 14px;\n  left: 50%;\n  transform: translateX(-50%);\n  font-size: 28px;\n  line-height: 1;\n}\n\n.story-card-label {\n  font-size: 11px;\n  font-weight: 800;\n  color: var(--bg-lowest);\n  text-align: center;\n  line-height: 1.3;\n  text-shadow: 0 1px 3px rgba(0,0,0,0.4);\n  z-index: 1;\n}\n\n/* Discovery card — distinctive purple/indigo gradient */\n.story-card--discovery {\n  background: linear-gradient(145deg, var(--c-purple-25) 0%, var(--c-indigo-25) 100%);\n  border: 2px solid rgba(255,255,255,0.2);\n}\n\n.story-card--discovery .story-card-icon {\n  font-size: 32px;\n  color: var(--bg-lowest);\n  text-shadow: 0 0 12px rgba(200,150,255,0.8);\n  animation: pulse-glow 2s ease-in-out infinite;\n}\n\n@keyframes pulse-glow {\n  0%, 100% { opacity: 1; text-shadow: 0 0 8px rgba(200,150,255,0.6); }\n  50% { opacity: 0.85; text-shadow: 0 0 20px rgba(200,150,255,1); }\n}\n\n.story-card--tournament { background: linear-gradient(145deg, var(--c-blue-30) 0%, var(--c-denim-25) 100%); }\n.story-card--offer { background: linear-gradient(145deg, var(--c-orange-25) 0%, var(--c-orange-35) 100%); }\n.story-card--social { background: linear-gradient(145deg, var(--c-emerald-25) 0%, var(--c-emerald-35) 100%); }\n\n.touchpoint-label {\n  font-size: 11px;\n  font-weight: 700;\n  text-transform: uppercase;\n  letter-spacing: 0.8px;\n  color: var(--text-muted);\n  padding: 0 0 6px;\n  margin-top: 20px;\n  display: flex;\n  align-items: center;\n  gap: 6px;\n}\n\n.touchpoint-label:first-of-type { margin-top: 0; }\n\n.touchpoint-context {\n  background: var(--bg-medium);\n  color: var(--text-muted);\n  font-size: 10px;\n  padding: 2px 7px;\n  border-radius: 10px;\n  letter-spacing: 0.3px;\n  text-transform: none;\n  font-weight: 600;\n}\n\n.host-page h1 {\n  font-size: 22px;\n  font-weight: 800;\n  letter-spacing: 0.5px;\n  margin-bottom: 20px;\n  color: var(--text-default);\n}\n\n.carousel-section { margin-bottom: 32px; }\n\n.section-header {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  margin-bottom: 12px;\n}\n\n.section-title {\n  font-size: 14px;\n  font-weight: 800;\n  text-transform: uppercase;\n  letter-spacing: 1px;\n  color: var(--text-default);\n}\n\n.view-all-btn {\n  background: none;\n  border: none;\n  color: var(--c-orange-25);\n  font-size: 13px;\n  font-weight: 600;\n  cursor: pointer;\n  padding: 4px 8px;\n}\n\n.carousel-preview {\n  display: flex;\n  gap: 12px;\n  overflow: hidden;\n}\n\n.carousel-preview .bet-card {\n  min-width: 260px;\n  flex-shrink: 0;\n}\n\n/* ─── Bet Cards ────────────────────────────────────────────── */\n.bet-card {\n  background: var(--bg-lowest);\n  border-radius: 12px;\n  overflow: hidden;\n  box-shadow: 0 2px 12px rgba(0,0,0,0.08);\n  user-select: none;\n}\n\n/* Accumulator Card */\n.acca-header {\n  background: var(--text-default);\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  padding: 12px 14px;\n}\n\n.acca-title {\n  color: var(--bg-lowest);\n  font-size: 14px;\n  font-weight: 700;\n}\n\n.acca-total-odds {\n  background: linear-gradient(135deg, var(--c-orange-25), var(--c-orange-20));\n  color: var(--bg-lowest);\n  font-size: 14px;\n  font-weight: 800;\n  padding: 4px 10px;\n  border-radius: 20px;\n}\n\n.acca-bonus-pill {\n  background: linear-gradient(135deg, var(--c-amber-25), var(--c-amber-30));\n  color: var(--bg-lowest);\n  font-size: 12px;\n  font-weight: 800;\n  padding: 5px 11px;\n  border-radius: 20px;\n  white-space: nowrap;\n  letter-spacing: 0.2px;\n}\n\n.acca-subtext {\n  padding: 6px 14px 0;\n  font-size: 11px;\n  color: var(--text-muted);\n  font-style: italic;\n  display: flex;\n  align-items: center;\n  gap: 4px;\n}\n\n.acca-legs { padding: 0 14px; }\n\n.leg-row {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  padding: 10px 0;\n  border-bottom: 1px dashed var(--bg-medium);\n}\n\n.leg-row:last-child { border-bottom: none; }\n\n.leg-info {\n  display: flex;\n  align-items: flex-start;\n  gap: 8px;\n  flex: 1;\n  min-width: 0;\n}\n\n/* Sport icon replaces the old badge */\n.leg-sport-icon {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  width: 28px;\n  height: 28px;\n  border-radius: 50%;\n  font-size: 14px;\n  flex-shrink: 0;\n  margin-top: 1px;\n}\n\n.leg-badge { font-size: 18px; flex-shrink: 0; margin-top: 1px; }\n\n.leg-details {\n  display: flex;\n  flex-direction: column;\n  gap: 1px;\n  min-width: 0;\n}\n\n.leg-market {\n  font-size: 12px;\n  font-weight: 700;\n  color: var(--text-default);\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n}\n\n.extra-markets {\n  display: inline-block;\n  background: var(--bg-medium);\n  border-radius: 10px;\n  font-size: 10px;\n  padding: 1px 5px;\n  font-weight: 600;\n  color: var(--text-muted);\n}\n\n.leg-fixture {\n  font-size: 11px;\n  color: var(--text-muted);\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n}\n\n.leg-time { font-size: 11px; color: var(--text-muted); }\n\n/* SB Design System — SelectionButton (default state) */\n.leg-odds {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  min-width: 48px;\n  min-height: 36px;\n  padding: 6px 10px;\n  border: none;\n  border-radius: 8px;\n  background: #F7F9FC;\n  box-shadow: inset 0 0 0 1px #E2E8F8;\n  font-family: var(--font-ui);\n  font-size: 14px;\n  font-weight: 700;\n  line-height: 16px;\n  color: var(--text-default);\n  flex-shrink: 0;\n  margin-left: 10px;\n  transition: background var(--dur-fast) var(--ease-standard),\n              box-shadow var(--dur-fast) var(--ease-standard),\n              color var(--dur-fast) var(--ease-standard);\n}\n\n.leg-odds:hover { background: #EAEEFB; }\n\n/* SB SelectionButton — selected state (orange fill, white text) */\n.leg-odds--selected {\n  background: var(--bg-primary);\n  box-shadow: inset 0 0 0 1px rgba(9,13,21,0);\n  color: #fff;\n}\n\n.leg-odds--selected:hover { background: var(--bg-primary-hover); }\n\n.acca-footer {\n  padding: 10px 14px 0;\n  text-align: center;\n}\n\n.social-proof {\n  font-size: 12px;\n  color: var(--text-muted);\n  font-weight: 500;\n}\n\n/* Bet Builder Card */\n.bb-card { padding: 0; }\n\n.bb-top-bar {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  padding: 10px 14px;\n}\n\n.enhancement-badge {\n  background: linear-gradient(135deg, var(--c-orange-25), var(--c-orange-30));\n  color: var(--bg-lowest);\n  font-size: 11px;\n  font-weight: 700;\n  padding: 5px 10px;\n  border-radius: 6px;\n  letter-spacing: 0.3px;\n}\n\n.bb-popularity {\n  font-size: 13px;\n  font-weight: 600;\n  color: var(--text-muted);\n}\n\n.bb-match-header {\n  text-align: center;\n  padding: 0 14px 10px;\n  border-bottom: 1px solid var(--bg-medium);\n}\n\n.bb-date {\n  display: block;\n  font-size: 11px;\n  color: var(--text-muted);\n  margin-bottom: 6px;\n}\n\n.bb-teams {\n  display: flex;\n  justify-content: center;\n  align-items: center;\n  gap: 8px;\n  font-size: 15px;\n  font-weight: 700;\n}\n\n.bb-flag { font-size: 20px; }\n.bb-vs-flag { font-size: 20px; }\n\n.bb-legs {\n  padding: 10px 14px;\n}\n\n.bb-leg {\n  display: flex;\n  align-items: baseline;\n  gap: 6px;\n  font-size: 12px;\n  color: var(--text-subtle);\n  padding: 3px 0;\n}\n\n.bb-leg-bullet { color: var(--text-default); font-size: 14px; }\n.bb-leg-market { color: var(--text-muted); }\n\n.bb-odds-row {\n  display: flex;\n  justify-content: center;\n  padding: 8px 14px 0;\n}\n\n.bb-odds-pill {\n  border: 1.5px solid var(--border-default);\n  border-radius: 20px;\n  padding: 6px 18px;\n  display: flex;\n  align-items: center;\n  gap: 10px;\n}\n\n.odds-original {\n  font-size: 14px;\n  color: var(--text-disabled);\n  text-decoration: line-through;\n}\n\n.odds-enhanced {\n  font-size: 16px;\n  font-weight: 800;\n  color: var(--text-default);\n}\n\n/* Add to Betslip CTA */\n.add-to-betslip {\n  display: block;\n  width: calc(100% - 28px);\n  margin: 12px 14px 14px;\n  padding: 13px;\n  background: transparent;\n  border: 1.5px solid var(--border-default);\n  border-radius: 8px;\n  font-size: 13px;\n  font-weight: 700;\n  letter-spacing: 0.5px;\n  cursor: pointer;\n  color: var(--text-default);\n  transition: background 0.15s, color 0.15s, border-color 0.15s;\n  text-align: center;\n}\n\n.add-to-betslip .cta-odds { color: var(--c-emerald-25); }\n.add-to-betslip:hover { background: var(--bg-lowest-hover); }\n.add-to-betslip.added {\n  background: color-mix(in srgb, var(--c-emerald-10) 55%, white);\n  border-color: var(--c-emerald-25);\n  color: var(--c-emerald-25);\n}\n\n/* ─── Card Badge System ────────────────────────────────────── */\n.card-top-bar {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  padding: 10px 14px;\n}\n\n.card-top-bar--stacked {\n  flex-direction: column;\n  align-items: flex-start;\n  gap: 4px;\n  padding-bottom: 8px;\n}\n\n.badge-row {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  width: 100%;\n}\n\n.badge {\n  font-size: 11px;\n  font-weight: 700;\n  padding: 5px 10px;\n  border-radius: 6px;\n  letter-spacing: 0.3px;\n}\n\n.badge--enhanced {\n  background: linear-gradient(135deg, var(--c-orange-25), var(--c-orange-30));\n  color: var(--bg-lowest);\n}\n\n.badge--boost {\n  background: linear-gradient(135deg, var(--c-purple-25), var(--c-indigo-25));\n  color: var(--bg-lowest);\n}\n\n.badge--personal {\n  background: linear-gradient(135deg, var(--c-emerald-30), var(--c-emerald-35));\n  color: var(--bg-lowest);\n}\n\n.badge--acca {\n  background: linear-gradient(135deg, var(--c-amber-25), var(--c-amber-30));\n  color: var(--bg-lowest);\n}\n\n.badge-reason {\n  font-size: 11px;\n  color: var(--text-muted);\n  padding-left: 2px;\n  font-style: italic;\n}\n\n/* Bet Builder CTA row — Edit + Add side by side */\n.bb-cta-row {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  margin: 12px 14px 14px;\n}\n\n.bb-edit-btn {\n  flex-shrink: 0;\n  padding: 11px 14px;\n  border: 1.5px solid var(--border-default);\n  border-radius: 8px;\n  background: var(--bg-lowest-hover);\n  font-size: 13px;\n  font-weight: 600;\n  color: var(--text-muted);\n  cursor: pointer;\n  white-space: nowrap;\n  transition: background 0.15s, border-color 0.15s;\n}\n\n.bb-edit-btn:hover {\n  background: var(--bg-medium);\n  border-color: var(--text-default);\n  color: var(--text-default);\n}\n\n.bb-cta-row .add-to-betslip {\n  flex: 1;\n  margin: 0;\n}\n\n/* ─── Edit Card Modal ───────────────────────────────────────── */\n#edit-card-overlay {\n  position: fixed;\n  inset: 0;\n  background: rgba(0,0,0,0.5);\n  z-index: 600;\n  opacity: 0;\n  pointer-events: none;\n  transition: opacity 0.25s ease;\n}\n\n#edit-card-overlay.open { opacity: 1; pointer-events: all; }\n\n#edit-card-modal {\n  position: fixed;\n  left: 0; right: 0; bottom: 0;\n  background: var(--bg-layout);\n  border-radius: 20px 20px 0 0;\n  z-index: 601;\n  max-height: 85vh;\n  display: flex;\n  flex-direction: column;\n  transform: translateY(100%);\n  transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);\n  max-width: 480px;\n  margin: 0 auto;\n}\n\n#edit-card-modal.open { transform: translateY(0); }\n\n.edit-card-header {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  padding: 10px 16px 12px;\n  flex-shrink: 0;\n}\n\n.edit-card-title {\n  font-size: 17px;\n  font-weight: 800;\n  color: var(--text-default);\n}\n\n#edit-card-content {\n  overflow-y: auto;\n  flex: 1;\n  padding: 0 16px 24px;\n  -webkit-overflow-scrolling: touch;\n}\n\n.edit-match-header {\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  font-size: 15px;\n  font-weight: 700;\n  color: var(--text-default);\n  padding: 4px 0 12px;\n}\n\n.edit-match-vs {\n  font-size: 12px;\n  color: var(--text-disabled);\n  font-weight: 500;\n}\n\n.edit-instructions {\n  font-size: 12px;\n  color: var(--text-muted);\n  text-align: center;\n  margin-bottom: 16px;\n  font-style: italic;\n}\n\n.edit-legs {\n  display: flex;\n  flex-direction: column;\n  gap: 16px;\n  margin-bottom: 20px;\n}\n\n.edit-leg-row {\n  background: var(--bg-lowest);\n  border-radius: 12px;\n  padding: 12px 14px;\n  box-shadow: 0 1px 6px rgba(0,0,0,0.06);\n}\n\n.edit-leg-market {\n  font-size: 12px;\n  font-weight: 700;\n  text-transform: uppercase;\n  letter-spacing: 0.5px;\n  color: var(--text-muted);\n  margin-bottom: 10px;\n}\n\n.edit-leg-alts {\n  display: flex;\n  flex-direction: column;\n  gap: 6px;\n}\n\n.alt-option {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  padding: 11px 14px;\n  border: 1.5px solid var(--border-default);\n  border-radius: 10px;\n  background: var(--bg-lowest);\n  cursor: pointer;\n  transition: all 0.15s;\n  text-align: left;\n  width: 100%;\n}\n\n.alt-option:hover { background: var(--bg-lowest-hover); border-color: var(--border-strong); }\n\n.alt-option.selected {\n  border-color: var(--text-default);\n  background: var(--bg-lowest-active);\n}\n\n.alt-name {\n  font-size: 14px;\n  font-weight: 600;\n  color: var(--text-default);\n}\n\n.alt-odds {\n  font-size: 14px;\n  font-weight: 800;\n  color: var(--c-blue-30);\n  background: color-mix(in srgb, var(--c-blue-15) 45%, white);\n  padding: 3px 9px;\n  border-radius: 8px;\n}\n\n.alt-option.selected .alt-odds {\n  background: var(--text-default);\n  color: var(--bg-lowest);\n}\n\n.current-pick {\n  background: color-mix(in srgb, var(--c-emerald-10) 55%, white);\n  color: var(--c-emerald-25);\n  font-size: 11px;\n}\n\n/* Fixed (non-editable) legs */\n.edit-leg-row--fixed { opacity: 0.6; }\n\n.edit-leg-fixed-selection {\n  font-size: 14px;\n  font-weight: 600;\n  color: var(--text-muted);\n  display: flex;\n  align-items: center;\n  gap: 6px;\n}\n\n.edit-leg-lock { font-size: 12px; }\n\n/* Confirm button */\n.edit-confirm-btn {\n  display: block;\n  width: 100%;\n  padding: 15px;\n  background: var(--text-default);\n  color: var(--bg-lowest);\n  border: none;\n  border-radius: 12px;\n  font-size: 15px;\n  font-weight: 700;\n  cursor: pointer;\n  transition: opacity 0.15s;\n}\n\n.edit-confirm-btn:hover { opacity: 0.88; }\n\n/* BB CTA with inline odds */\n.bb-cta {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n}\n\n.cta-label { flex: 1; text-align: left; }\n\n.cta-odds-group {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n}\n\n.bb-cta .odds-original {\n  font-size: 12px;\n  color: var(--text-disabled);\n  text-decoration: line-through;\n  font-weight: 500;\n}\n\n.bb-cta .odds-enhanced {\n  font-size: 15px;\n  font-weight: 800;\n  color: var(--c-emerald-25);\n}\n\n/* ─── Modal Overlay ────────────────────────────────────────── */\n#modal-overlay {\n  position: fixed;\n  inset: 0;\n  background: rgba(0,0,0,0.5);\n  z-index: 100;\n  opacity: 0;\n  pointer-events: none;\n  transition: opacity 0.3s ease;\n}\n\n#modal-overlay.open {\n  opacity: 1;\n  pointer-events: all;\n}\n\n/* ─── Bet Hub Modal ────────────────────────────────────────── */\n#bet-hub-modal {\n  position: fixed;\n  left: 0; right: 0; bottom: 0;\n  height: 93vh;\n  isolation: isolate;\n  background: var(--bg-layout);\n  border-radius: 20px 20px 0 0;\n  z-index: 101;\n  display: flex;\n  flex-direction: column;\n  transform: translateY(100%);\n  transition: transform 0.38s cubic-bezier(0.32, 0.72, 0, 1);\n  max-width: 480px;\n  margin: 0 auto;\n}\n\n#bet-hub-modal.open {\n  transform: translateY(0);\n}\n\n/* Modal Handle */\n.modal-handle {\n  width: 36px;\n  height: 4px;\n  background: var(--border-default);\n  border-radius: 2px;\n  margin: 10px auto 0;\n  flex-shrink: 0;\n}\n\n/* Modal Header */\n.hub-header {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  padding: 14px 16px 10px;\n  flex-shrink: 0;\n}\n\n.hub-header-left {\n  display: flex;\n  flex-direction: column;\n}\n\n#hub-header-title {\n  font-size: 18px;\n  font-weight: 800;\n  color: var(--text-default);\n  line-height: 1.2;\n}\n\n#hub-card-count {\n  font-size: 12px;\n  color: var(--text-muted);\n  margin-top: 2px;\n}\n\n.hub-close-btn {\n  background: var(--bg-medium);\n  border: none;\n  border-radius: 50%;\n  width: 32px;\n  height: 32px;\n  font-size: 16px;\n  cursor: pointer;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  color: var(--text-muted);\n  flex-shrink: 0;\n}\n\n/* Single scrollable filter carousel */\n.hub-filter-carousel {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  padding: 0 16px 12px;\n  overflow-x: auto;\n  overflow-y: visible;\n  -webkit-overflow-scrolling: touch;\n  scrollbar-width: none;\n  flex-shrink: 0;\n  cursor: grab;\n  user-select: none;\n}\n\n.hub-filter-carousel::-webkit-scrollbar { display: none; }\n\n/* Ensure all direct chip children don't shrink */\n.hub-filter-carousel > *,\n.hub-filter-carousel .filter-dropdown-wrap,\n.hub-filter-carousel .scope-chip,\n.hub-filter-carousel .filter-pill {\n  flex-shrink: 0;\n}\n\n.filter-divider {\n  width: 1px;\n  height: 22px;\n  background: var(--border-default);\n  flex-shrink: 0;\n}\n\n/* Scope Chip Row — kept for legacy reference, now unused */\n.hub-scope-row {\n  padding: 0 16px 12px;\n  flex-shrink: 0;\n}\n\n.scope-chip {\n  display: inline-flex;\n  align-items: center;\n  gap: 5px;\n  padding: 7px 13px;\n  border: 1.5px solid var(--border-default);\n  border-radius: 20px;\n  background: var(--bg-lowest);\n  font-size: 13px;\n  font-weight: 600;\n  line-height: 1.2;\n  color: var(--text-default);\n  cursor: pointer;\n  transition: all 0.15s;\n  white-space: nowrap;\n  flex-shrink: 0;\n  box-sizing: border-box;\n}\n\n.scope-chip .scope-chip-label { font-weight: 600; }\n\n.scope-chip:hover { background: var(--bg-lowest-hover); }\n\n.scope-chip.active {\n  background: var(--text-default);\n  border-color: var(--text-default);\n  color: var(--bg-lowest);\n}\n\n.scope-chip-label {\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n}\n\n/* Scope Sheet — sport + competition */\n#scope-overlay {\n  position: fixed;\n  inset: 0;\n  background: rgba(0,0,0,0.5);\n  z-index: 200;\n  opacity: 0;\n  pointer-events: none;\n  transition: opacity 0.25s ease;\n}\n\n#scope-overlay.open { opacity: 1; pointer-events: all; }\n\n#scope-sheet {\n  position: fixed;\n  left: 0; right: 0; bottom: 0;\n  background: var(--bg-lowest);\n  border-radius: 20px 20px 0 0;\n  z-index: 201;\n  padding: 0 20px 32px;\n  transform: translateY(100%);\n  transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);\n  max-width: 480px;\n  margin: 0 auto;\n}\n\n#scope-sheet.open { transform: translateY(0); }\n\n.scope-section-label {\n  font-size: 12px;\n  font-weight: 700;\n  text-transform: uppercase;\n  letter-spacing: 0.5px;\n  color: var(--text-muted);\n  margin-bottom: 10px;\n}\n\n.scope-hint {\n  text-transform: none;\n  letter-spacing: 0;\n  font-weight: 500;\n  color: var(--text-disabled);\n  font-style: italic;\n}\n\n.scope-sports {\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n  margin-bottom: 20px;\n}\n\n.scope-opt {\n  display: flex;\n  align-items: center;\n  padding: 13px 16px;\n  border: 1.5px solid var(--border-default);\n  border-radius: 12px;\n  background: var(--bg-lowest);\n  font-size: 14px;\n  font-weight: 600;\n  color: var(--text-default);\n  cursor: pointer;\n  text-align: left;\n  transition: all 0.15s;\n}\n\n.scope-opt:hover { background: var(--bg-lowest-hover); }\n\n.scope-opt.active {\n  border-color: var(--text-default);\n  background: var(--bg-lowest-active);\n}\n\n.scope-competition-wrap { display: none; margin-bottom: 20px; }\n\n.scope-competitions {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 8px;\n}\n\n.comp-chip {\n  padding: 8px 14px;\n  border: 1.5px solid var(--border-default);\n  border-radius: 18px;\n  background: var(--bg-lowest);\n  font-size: 13px;\n  font-weight: 600;\n  color: var(--text-muted);\n  cursor: pointer;\n  transition: all 0.15s;\n}\n\n.comp-chip:hover { background: var(--bg-lowest-hover); }\n\n.comp-chip.active {\n  background: var(--text-default);\n  border-color: var(--text-default);\n  color: var(--bg-lowest);\n}\n\n/* ─── Secondary Filter Bar (now merged into hub-filter-carousel) ── */\n.hub-filter-bar {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  padding: 0;\n  flex-shrink: 0;\n  position: relative;\n}\n\n.filter-pill {\n  display: flex;\n  align-items: center;\n  gap: 5px;\n  padding: 7px 13px;\n  border: 1.5px solid var(--border-default);\n  border-radius: 20px;\n  background: var(--bg-lowest);\n  font-size: 13px;\n  font-weight: 600;\n  line-height: 1.2;\n  color: var(--text-default);\n  cursor: pointer;\n  white-space: nowrap;\n  transition: all 0.15s;\n  flex-shrink: 0;\n}\n\n.filter-pill:hover { background: var(--bg-lowest-hover); }\n\n.filter-pill.active {\n  background: var(--text-default);\n  border-color: var(--text-default);\n  color: var(--bg-lowest);\n}\n\n.hub-clear-row {\n  display: flex;\n  justify-content: flex-end;\n  padding: 0 16px 10px;\n  flex-shrink: 0;\n}\n\n.filter-pill--reset {\n  border-color: var(--c-amber-25);\n  color: var(--c-amber-30);\n  background: color-mix(in srgb, var(--c-yellow-15) 40%, white);\n}\n\n.filter-pill--reset:hover {\n  background: var(--c-yellow-15);\n}\n\n.filter-pill-arrow {\n  font-size: 11px;\n  transition: transform 0.2s;\n}\n\n.filter-pill-arrow.open { transform: rotate(180deg); }\n\n/* Dropdown — positioned relative to modal, outside overflow carousel */\n.bet-type-dropdown {\n  display: none;\n  position: absolute;\n  top: auto; /* set via JS */\n  left: 16px;\n  background: var(--bg-lowest);\n  border: 1.5px solid var(--border-default);\n  border-radius: 12px;\n  box-shadow: 0 8px 24px rgba(0,0,0,0.15);\n  padding: 6px 0;\n  min-width: 220px;\n  z-index: 600;\n}\n\n.bet-type-dropdown.open { display: block; }\n\n.bt-option {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  padding: 10px 16px;\n  font-size: 13px;\n  font-weight: 500;\n  color: var(--text-default);\n  cursor: pointer;\n  transition: background 0.12s;\n}\n\n.bt-option:hover { background: var(--bg-lowest-hover); }\n\n.bt-option input[type=\"radio\"] {\n  accent-color: var(--text-default);\n  width: 15px;\n  height: 15px;\n  flex-shrink: 0;\n}\n\n.bt-option.selected { font-weight: 700; }\n\n/* Divider after \"All types\" */\n.bt-option:first-child {\n  border-bottom: 1px solid var(--bg-medium);\n  margin-bottom: 2px;\n}\n\n/* Top Mode Switch (compact, segmented) */\n.hub-mode-switch {\n  display: flex;\n  gap: 4px;\n  padding: 4px;\n  margin: 0 16px 10px;\n  background: var(--bg-medium);\n  border-radius: 20px;\n  flex-shrink: 0;\n}\n\n.mode-seg {\n  flex: 1;\n  padding: 7px 0;\n  border: none;\n  border-radius: 16px;\n  background: transparent;\n  font-size: 13px;\n  font-weight: 700;\n  color: var(--text-muted);\n  cursor: pointer;\n  transition: all 0.18s;\n}\n\n.mode-seg.active {\n  background: var(--bg-lowest);\n  color: var(--text-default);\n  box-shadow: 0 1px 4px rgba(0,0,0,0.10);\n}\n\n.mode-seg.disabled {\n  color: var(--text-disabled);\n  cursor: not-allowed;\n}\n\n/* Modal Content */\n#hub-content {\n  flex: 1;\n  overflow-y: auto;\n  -webkit-overflow-scrolling: touch;\n}\n\n/* Browse View */\n.browse-view {\n  padding: 8px 16px 24px;\n  display: flex;\n  flex-direction: column;\n  gap: 14px;\n}\n\n/* ─── Betslip Floating Bar ─────────────────────────────────── */\n#betslip-bar {\n  position: fixed;\n  bottom: 24px;\n  right: 20px;\n  z-index: 300;\n  transform: scale(0) translateY(20px);\n  transform-origin: bottom right;\n  transition: transform 0.25s var(--ease-standard);\n  pointer-events: none;\n  max-width: 480px;\n}\n\n/* Keep the pill within the prototype column on wide viewports */\n@media (min-width: 480px) {\n  #betslip-bar {\n    right: calc(50vw - 480px/2 + 16px);\n  }\n}\n\n#betslip-bar.visible {\n  transform: scale(1) translateY(0);\n  pointer-events: all;\n}\n\n#betslip-bar.bump .bs-pill {\n  animation: bump 0.3s ease;\n}\n\n@keyframes bump {\n  0%   { transform: scale(1); }\n  50%  { transform: scale(1.18); }\n  100% { transform: scale(1); }\n}\n\n.bs-pill {\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  background: var(--text-default);\n  color: var(--bg-lowest);\n  border: none;\n  border-radius: 50%;\n  width: 44px;\n  height: 44px;\n  cursor: pointer;\n  box-shadow: 0 4px 20px rgba(0,0,0,0.25);\n  transition: background 0.15s, box-shadow 0.15s;\n}\n\n.bs-pill:hover {\n  background: var(--c-gray-65);\n  box-shadow: 0 6px 24px rgba(0,0,0,0.3);\n}\n\n.bs-pill-count {\n  color: var(--bg-lowest);\n  font-size: 15px;\n  font-weight: 800;\n  line-height: 1;\n}\n\n/* ─── Betslip Sheet ─────────────────────────────────────────── */\n#betslip-overlay {\n  position: fixed;\n  inset: 0;\n  background: rgba(0,0,0,0.5);\n  z-index: 500;\n  opacity: 0;\n  pointer-events: none;\n  transition: opacity 0.25s ease;\n}\n\n#betslip-overlay.open { opacity: 1; pointer-events: all; }\n\n#betslip-sheet {\n  position: fixed;\n  left: 0; right: 0; bottom: 0;\n  background: var(--bg-layout);\n  border-radius: 20px 20px 0 0;\n  z-index: 501;\n  display: flex;\n  flex-direction: column;\n  max-height: 88vh;\n  transform: translateY(100%);\n  transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);\n  max-width: 480px;\n  margin: 0 auto;\n}\n\n#betslip-sheet.open { transform: translateY(0); }\n\n.bs-handle {\n  width: 36px;\n  height: 4px;\n  background: var(--border-default);\n  border-radius: 2px;\n  margin: 10px auto 0;\n  flex-shrink: 0;\n}\n\n.bs-header {\n  display: flex;\n  align-items: center;\n  padding: 12px 16px 8px;\n  gap: 8px;\n  flex-shrink: 0;\n}\n\n.bs-header-title {\n  font-size: 18px;\n  font-weight: 800;\n  color: var(--text-default);\n}\n\n.bs-header-count {\n  font-size: 13px;\n  font-weight: 600;\n  color: var(--text-muted);\n}\n\n.bs-header-actions {\n  display: flex;\n  gap: 6px;\n  margin-left: auto;\n}\n\n.bs-icon-btn {\n  background: var(--bg-medium);\n  border: none;\n  border-radius: 8px;\n  padding: 7px 10px;\n  font-size: 13px;\n  font-weight: 700;\n  color: var(--text-muted);\n  cursor: pointer;\n}\n\n#betslip-sheet-content {\n  overflow-y: auto;\n  flex: 1;\n  -webkit-overflow-scrolling: touch;\n}\n\n/* Actions row */\n.bs-actions {\n  display: flex;\n  gap: 8px;\n  padding: 8px 16px 12px;\n  border-bottom: 1px solid var(--border-default);\n}\n\n.bs-action-btn {\n  display: flex;\n  align-items: center;\n  gap: 5px;\n  padding: 8px 14px;\n  border: 1.5px solid var(--border-default);\n  border-radius: 20px;\n  background: var(--bg-lowest);\n  font-size: 12px;\n  font-weight: 600;\n  color: var(--text-subtle);\n  cursor: pointer;\n  white-space: nowrap;\n}\n\n/* Tabs */\n.bs-tabs {\n  display: flex;\n  background: var(--bg-medium);\n  border-radius: 12px;\n  margin: 12px 16px;\n  padding: 4px;\n  flex-shrink: 0;\n}\n\n.bs-tab {\n  flex: 1;\n  padding: 9px 0;\n  border: none;\n  border-radius: 9px;\n  background: transparent;\n  font-size: 13px;\n  font-weight: 600;\n  color: var(--text-muted);\n  cursor: pointer;\n  transition: all 0.18s;\n}\n\n.bs-tab.active {\n  background: var(--bg-lowest);\n  color: var(--text-default);\n  font-weight: 700;\n  box-shadow: 0 2px 6px rgba(0,0,0,0.1);\n}\n\n/* Bet rows */\n.bs-bets {\n  padding: 0 16px;\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n  margin-bottom: 12px;\n}\n\n.bs-bet-row {\n  display: flex;\n  align-items: flex-start;\n  gap: 10px;\n  background: var(--bg-lowest);\n  border-radius: 12px;\n  padding: 14px;\n  box-shadow: 0 1px 6px rgba(0,0,0,0.06);\n}\n\n.bs-bet-icon {\n  font-size: 20px;\n  flex-shrink: 0;\n  margin-top: 2px;\n}\n\n.bs-bet-info {\n  flex: 1;\n  min-width: 0;\n}\n\n.bs-bet-title {\n  font-size: 14px;\n  font-weight: 700;\n  color: var(--text-default);\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n}\n\n.bs-bet-market {\n  font-size: 12px;\n  color: var(--c-orange-25);\n  font-weight: 600;\n  margin-top: 2px;\n}\n\n.bs-bet-fixture {\n  font-size: 11px;\n  color: var(--text-muted);\n  margin-top: 2px;\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n}\n\n.bs-bet-odds {\n  font-size: 14px;\n  font-weight: 800;\n  color: var(--text-default);\n  flex-shrink: 0;\n}\n\n.bs-bet-delete {\n  background: none;\n  border: none;\n  font-size: 14px;\n  color: var(--text-disabled);\n  cursor: pointer;\n  padding: 0;\n  flex-shrink: 0;\n}\n\n/* Footer */\n.bs-footer {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  padding: 14px 16px;\n  background: var(--bg-lowest);\n  border-top: 1px solid var(--bg-medium);\n  flex-shrink: 0;\n}\n\n.bs-footer-type {\n  font-size: 13px;\n  font-weight: 700;\n  color: var(--text-default);\n  flex: 1;\n}\n\n.bs-footer-odds {\n  font-size: 15px;\n  font-weight: 800;\n  color: var(--text-default);\n}\n\n.bs-footer-stake {\n  display: flex;\n  align-items: center;\n  border: 1.5px solid var(--border-default);\n  border-radius: 8px;\n  padding: 6px 10px;\n  gap: 4px;\n}\n\n.bs-stake-currency {\n  font-size: 13px;\n  font-weight: 600;\n  color: var(--text-muted);\n}\n\n.bs-stake-input {\n  border: none;\n  outline: none;\n  width: 60px;\n  font-size: 14px;\n  font-weight: 700;\n  color: var(--text-default);\n  background: transparent;\n  text-align: right;\n}\n\n/* Bet card wrapper */\n.bs-bet-card {\n  background: var(--bg-lowest);\n  border-radius: 12px;\n  box-shadow: 0 1px 6px rgba(0,0,0,0.06);\n  overflow: hidden;\n  margin-bottom: 2px;\n}\n\n.bs-bet-card .bs-bet-row {\n  background: transparent;\n  border-radius: 0;\n  box-shadow: none;\n  margin-bottom: 0;\n}\n\n/* BB Boost section */\n.bs-bb-boost {\n  border: 1.5px solid var(--c-orange-25);\n  border-radius: 10px;\n  margin: 0 14px 14px;\n  overflow: hidden;\n}\n\n.bs-bb-boost-header {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  background: linear-gradient(135deg, var(--c-orange-25), var(--c-orange-30));\n  padding: 10px 12px;\n}\n\n.bs-bb-badge {\n  font-size: 12px;\n  font-weight: 800;\n  color: var(--bg-lowest);\n  letter-spacing: 0.3px;\n  flex: 1;\n}\n\n.bs-bb-info {\n  background: rgba(255,255,255,0.25);\n  border: none;\n  border-radius: 50%;\n  width: 20px;\n  height: 20px;\n  font-size: 11px;\n  color: var(--bg-lowest);\n  font-weight: 700;\n  cursor: pointer;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  flex-shrink: 0;\n}\n\n/* Toggle */\n.bs-toggle {\n  position: relative;\n  display: inline-flex;\n  align-items: center;\n  cursor: pointer;\n  flex-shrink: 0;\n}\n\n.bs-toggle input { display: none; }\n\n.bs-toggle-track {\n  width: 42px;\n  height: 24px;\n  background: rgba(255,255,255,0.35);\n  border-radius: 12px;\n  position: relative;\n  transition: background 0.2s;\n}\n\n.bs-toggle-track::after {\n  content: '';\n  position: absolute;\n  top: 3px;\n  left: 3px;\n  width: 18px;\n  height: 18px;\n  background: var(--bg-lowest);\n  border-radius: 50%;\n  transition: transform 0.2s;\n  box-shadow: 0 1px 4px rgba(0,0,0,0.2);\n}\n\n.bs-toggle input:checked ~ .bs-toggle-track {\n  background: var(--bg-lowest);\n}\n\n.bs-toggle input:checked ~ .bs-toggle-track::after {\n  transform: translateX(18px);\n  background: var(--c-orange-25);\n}\n\n/* Requirements */\n.bs-bb-reqs {\n  padding: 10px 12px;\n  background: color-mix(in srgb, var(--c-orange-10) 35%, white);\n}\n\n.bs-bb-req-label {\n  font-size: 12px;\n  color: var(--text-subtle);\n  display: block;\n  margin-bottom: 8px;\n}\n\n.bs-bb-req-chips {\n  display: flex;\n  gap: 8px;\n  flex-wrap: wrap;\n}\n\n.bs-bb-chip {\n  font-size: 12px;\n  font-weight: 600;\n  color: var(--text-disabled);\n  padding: 4px 10px;\n  border: 1.5px solid var(--border-default);\n  border-radius: 16px;\n}\n\n.bs-bb-chip.met {\n  color: var(--c-emerald-25);\n  border-color: var(--c-emerald-25);\n  background: color-mix(in srgb, var(--c-emerald-10) 55%, white);\n}\n\n/* BB Boost footer line */\n.bs-bb-footer-line {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  padding: 10px 16px;\n  background: color-mix(in srgb, var(--c-orange-10) 35%, white);\n  border-top: 1px solid var(--c-orange-10);\n  border-bottom: 1px solid var(--c-orange-10);\n  flex-shrink: 0;\n}\n\n.bs-bb-footer-icon { font-size: 14px; }\n\n.bs-bb-footer-label {\n  font-size: 13px;\n  font-weight: 600;\n  color: var(--c-orange-25);\n  flex: 1;\n}\n\n.bs-bb-footer-value {\n  font-size: 13px;\n  font-weight: 700;\n  color: var(--text-default);\n}\n\n/* Bet Now */\n.bs-bet-now {\n  display: block;\n  width: calc(100% - 32px);\n  margin: 0 16px 20px;\n  padding: 16px;\n  background: var(--bg-medium);\n  color: var(--text-muted);\n  border: none;\n  border-radius: 12px;\n  font-size: 16px;\n  font-weight: 800;\n  letter-spacing: 1px;\n  cursor: pointer;\n  transition: background 0.2s, color 0.2s;\n  flex-shrink: 0;\n}\n\n.bs-bet-now.ready {\n  background: var(--c-emerald-25);\n  color: var(--bg-lowest);\n}\n\n/* ─── Mood Bottom Sheet ────────────────────────────────────── */\n#mood-overlay {\n  position: fixed;\n  inset: 0;\n  background: rgba(0,0,0,0.5);\n  z-index: 200;\n  opacity: 0;\n  pointer-events: none;\n  transition: opacity 0.25s ease;\n}\n\n#mood-overlay.open {\n  opacity: 1;\n  pointer-events: all;\n}\n\n#mood-sheet {\n  position: fixed;\n  left: 0; right: 0; bottom: 0;\n  background: var(--bg-lowest);\n  border-radius: 20px 20px 0 0;\n  z-index: 201;\n  padding: 0 20px 32px;\n  transform: translateY(100%);\n  transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);\n  max-width: 480px;\n  margin: 0 auto;\n}\n\n#mood-sheet.open { transform: translateY(0); }\n\n.mood-sheet-handle {\n  width: 36px;\n  height: 4px;\n  background: var(--border-default);\n  border-radius: 2px;\n  margin: 12px auto 16px;\n}\n\n.mood-sheet-title {\n  font-size: 17px;\n  font-weight: 700;\n  text-align: center;\n  color: var(--text-default);\n  margin-bottom: 20px;\n}\n\n.mood-options {\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n  margin-bottom: 24px;\n}\n\n.mood-option {\n  display: flex;\n  align-items: center;\n  gap: 14px;\n  padding: 14px 16px;\n  border: 1.5px solid var(--border-default);\n  border-radius: 12px;\n  background: var(--bg-lowest);\n  cursor: pointer;\n  text-align: left;\n  transition: all 0.15s;\n  width: 100%;\n}\n\n.mood-option:hover { background: var(--bg-lowest-hover); }\n\n.mood-option.selected {\n  border-color: var(--text-default);\n  background: var(--bg-lowest-active);\n}\n\n.mood-icon { font-size: 24px; flex-shrink: 0; }\n\n.mood-text {\n  display: flex;\n  flex-direction: column;\n  gap: 2px;\n  flex: 1;\n}\n\n.mood-name {\n  font-size: 14px;\n  font-weight: 700;\n  color: var(--text-default);\n}\n\n.mood-desc {\n  font-size: 12px;\n  color: var(--text-muted);\n}\n\n.mood-range {\n  font-size: 14px;\n  font-weight: 800;\n  color: var(--text-default);\n  flex-shrink: 0;\n  margin-right: 10px;\n  white-space: nowrap;\n}\n\n.mood-option.selected .mood-range { color: var(--text-default); }\n\n.mood-count { font-weight: 700; color: var(--text-muted); }\n\n.mood-check {\n  font-size: 16px;\n  font-weight: 700;\n  color: var(--text-default);\n  opacity: 0;\n  transition: opacity 0.15s;\n  flex-shrink: 0;\n}\n\n.mood-option.selected .mood-check { opacity: 1; }\n\n.mood-option--empty {\n  opacity: 0.4;\n  cursor: not-allowed;\n  background: var(--bg-lowest-hover);\n}\n\n.mood-option--empty .mood-icon { filter: grayscale(1); }\n.mood-option--empty .mood-name { color: var(--text-muted); }\n.mood-option--empty .mood-count { color: var(--text-disabled); }\n\n.mood-apply {\n  display: block;\n  width: 100%;\n  padding: 15px;\n  background: var(--text-default);\n  color: var(--bg-lowest);\n  border: none;\n  border-radius: 12px;\n  font-size: 15px;\n  font-weight: 700;\n  cursor: pointer;\n  margin-bottom: 12px;\n  transition: opacity 0.15s;\n}\n\n.mood-apply:hover { opacity: 0.9; }\n\n.mood-reset {\n  display: block;\n  width: 100%;\n  padding: 12px;\n  background: none;\n  border: none;\n  font-size: 14px;\n  font-weight: 600;\n  color: var(--text-muted);\n  cursor: pointer;\n}\n\n/* MEB card — Bet Builder Combo style */\n.meb-pop-row {\n  padding: 6px 14px 0;\n  font-size: 12px;\n  color: var(--text-muted);\n}\n\n.meb-popularity { font-weight: 500; }\n\n/* Header odds badge */\n.meb-header-odds {\n  background: var(--c-blue-30);\n  color: var(--bg-lowest);\n  font-size: 14px;\n  font-weight: 900;\n  padding: 5px 14px;\n  display: block;\n}\n\n/* Event list */\n.meb-events-list { padding: 0; }\n\n.meb-event-block { }\n.meb-event-block--border { border-bottom: 1px solid var(--bg-medium); }\n\n/* Event row — clickable header */\n.meb-event-row {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  padding: 10px 14px;\n  cursor: pointer;\n  user-select: none;\n}\n\n.meb-event-row:hover { background: var(--bg-lowest-hover); }\n\n/* Team logo circle */\n.meb-team-logo {\n  width: 32px;\n  height: 32px;\n  border-radius: 50%;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  flex-shrink: 0;\n}\n\n.meb-team-abbr {\n  font-size: 9px;\n  font-weight: 900;\n  color: var(--bg-lowest);\n  letter-spacing: 0.3px;\n}\n\n/* BB badge */\n.meb-bb-badge {\n  background: var(--c-purple-25);\n  color: var(--bg-lowest);\n  font-size: 9px;\n  font-weight: 800;\n  padding: 2px 5px;\n  border-radius: 4px;\n  flex-shrink: 0;\n}\n\n/* Event meta */\n.meb-event-meta {\n  flex: 1;\n  min-width: 0;\n  display: flex;\n  flex-direction: column;\n  gap: 1px;\n}\n\n.meb-event-title {\n  font-size: 13px;\n  font-weight: 700;\n  color: var(--text-default);\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n}\n\n.meb-event-time {\n  font-size: 11px;\n  color: var(--text-disabled);\n}\n\n/* Expand icon */\n.meb-expand-icon {\n  font-size: 12px;\n  color: var(--text-disabled);\n  transition: transform 0.2s;\n  flex-shrink: 0;\n}\n\n.meb-event-block.meb-expanded .meb-expand-icon { transform: rotate(180deg); }\n\n/* Per-event odds */\n.meb-event-odds {\n  border: 1.5px solid var(--border-default);\n  border-radius: 8px;\n  padding: 5px 10px;\n  font-size: 13px;\n  font-weight: 800;\n  color: var(--text-default);\n  flex-shrink: 0;\n  background: var(--bg-lowest);\n}\n\n/* Expanded legs */\n.meb-legs-expanded {\n  display: none;\n  padding: 0 14px 10px 54px;\n  flex-direction: column;\n  gap: 6px;\n}\n\n.meb-event-block.meb-expanded .meb-legs-expanded { display: flex; }\n\n.meb-fixture-name {\n  font-size: 11px;\n  color: var(--text-muted);\n  margin-bottom: 4px;\n}\n\n.meb-leg-expanded {\n  display: flex;\n  align-items: flex-start;\n  gap: 8px;\n}\n\n.meb-leg-circle {\n  width: 14px;\n  height: 14px;\n  border-radius: 50%;\n  border: 2px solid var(--border-default);\n  flex-shrink: 0;\n  margin-top: 2px;\n}\n\n.meb-leg-expanded-text {\n  display: flex;\n  flex-direction: column;\n  gap: 1px;\n}\n\n.meb-leg-value {\n  font-size: 13px;\n  font-weight: 700;\n  color: var(--text-default);\n}\n\n.meb-leg-market-name {\n  font-size: 12px;\n  color: var(--text-muted);\n}\n\n/* ─── Multi-Event Builder Card ─────────────────────────────── */\n.meb-events { padding: 0 14px; }\n\n.meb-event { padding: 10px 0; }\n\n.meb-event--divider {\n  border-bottom: 1px solid var(--bg-medium);\n  padding-bottom: 12px;\n  margin-bottom: 2px;\n}\n\n.meb-event-header {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  margin-bottom: 8px;\n  gap: 8px;\n}\n\n.meb-event-teams {\n  display: flex;\n  align-items: center;\n  gap: 5px;\n  flex-wrap: wrap;\n}\n\n.meb-flag { font-size: 16px; }\n\n.meb-team-name {\n  font-size: 13px;\n  font-weight: 700;\n  color: var(--text-default);\n}\n\n.meb-vs {\n  font-size: 11px;\n  color: var(--text-disabled);\n  font-weight: 500;\n}\n\n.meb-event-date {\n  font-size: 10px;\n  color: var(--text-muted);\n  white-space: nowrap;\n  flex-shrink: 0;\n}\n\n.meb-legs { display: flex; flex-direction: column; gap: 4px; }\n\n.meb-leg {\n  display: flex;\n  align-items: flex-start;\n  gap: 7px;\n  font-size: 12px;\n  color: var(--text-subtle);\n}\n\n.meb-leg-dot {\n  width: 6px;\n  height: 6px;\n  border-radius: 50%;\n  background: var(--c-gray-35);\n  flex-shrink: 0;\n  margin-top: 4px;\n}\n\n.meb-leg-market { color: var(--text-muted); }\n\n/* ─── Star Player Card ─────────────────────────────────────── */\n.sp-card {\n  background: var(--bg-lowest);\n  overflow: hidden;\n}\n\n.sp-hero {\n  background: linear-gradient(160deg, var(--c-gray-70) 0%, var(--c-gray-80) 100%);\n  padding: 14px 16px 18px;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 6px;\n  position: relative;\n}\n\n.sp-popularity {\n  position: absolute;\n  top: 12px;\n  right: 14px;\n  font-size: 12px;\n  font-weight: 700;\n  color: var(--bg-lowest);\n  background: rgba(255,255,255,0.15);\n  padding: 3px 9px;\n  border-radius: 12px;\n}\n\n.sp-jersey {\n  font-size: 44px;\n  line-height: 1;\n  filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4));\n}\n\n.sp-team-logos {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  font-size: 22px;\n  margin-top: 2px;\n}\n\n.sp-divider {\n  font-size: 14px;\n  color: rgba(255,255,255,0.4);\n  font-weight: 300;\n}\n\n.sp-player-name {\n  font-size: 17px;\n  font-weight: 800;\n  color: var(--bg-lowest);\n  letter-spacing: 0.2px;\n  margin-top: 4px;\n}\n\n.sp-fixture {\n  font-size: 12px;\n  color: rgba(255,255,255,0.6);\n}\n\n.sp-markets {\n  padding: 12px 16px 4px;\n  display: flex;\n  flex-direction: column;\n  gap: 6px;\n  border-bottom: 1px solid var(--bg-layout);\n}\n\n.sp-market {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  font-size: 13px;\n  color: var(--text-subtle);\n}\n\n.sp-market-dot {\n  font-size: 12px;\n  color: var(--text-disabled);\n  flex-shrink: 0;\n}\n\n.sp-odds-row {\n  display: flex;\n  justify-content: center;\n  padding: 12px 16px 0;\n}\n\n.sp-odds {\n  font-size: 20px;\n  font-weight: 800;\n  color: var(--c-blue-30);\n  letter-spacing: 0.5px;\n}\n\n/* ─── Discover / Swipe ─────────────────────────────────────── */\n#discover-container {\n  height: 100%;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  padding: 8px 16px 16px;\n  overflow: hidden;\n}\n\n.discover-hints {\n  display: flex;\n  justify-content: space-between;\n  width: 100%;\n  padding: 0 8px;\n  margin-bottom: 10px;\n}\n\n.hint-left, .hint-right {\n  font-size: 12px;\n  font-weight: 600;\n  color: var(--text-disabled);\n}\n\n.swipe-stack {\n  position: relative;\n  width: 100%;\n  flex: 1;\n  display: flex;\n  align-items: flex-start;\n  justify-content: center;\n}\n\n.swipe-card {\n  position: absolute;\n  width: 100%;\n  top: 0;\n  border-radius: 12px;\n  overflow: hidden;\n}\n\n.swipe-card--next {\n  transform: scale(0.93) translateY(14px);\n  z-index: 1;\n  pointer-events: none;\n  opacity: 0.55;\n  filter: brightness(0.85);\n  transition: transform 0.3s ease, opacity 0.3s ease;\n}\n\n.swipe-card--active {\n  z-index: 2;\n  cursor: grab;\n  touch-action: none;\n}\n\n.swipe-card--active:active { cursor: grabbing; }\n\n/* Direction hint overlays */\n.swipe-card--active.hint-save::after {\n  content: 'ADD TO BETSLIP';\n  position: absolute;\n  top: 20px;\n  right: 20px;\n  background: rgba(46, 204, 113, 0.9);\n  color: var(--bg-lowest);\n  font-weight: 800;\n  font-size: 14px;\n  padding: 6px 14px;\n  border-radius: 8px;\n  border: 2px solid var(--c-emerald-25);\n  transform: rotate(15deg);\n  pointer-events: none;\n}\n\n.swipe-card--active.hint-pass::after {\n  content: 'PASS';\n  position: absolute;\n  top: 20px;\n  left: 20px;\n  background: rgba(231, 76, 60, 0.9);\n  color: var(--bg-lowest);\n  font-weight: 800;\n  font-size: 14px;\n  padding: 6px 14px;\n  border-radius: 8px;\n  border: 2px solid var(--c-orange-30);\n  transform: rotate(-15deg);\n  pointer-events: none;\n}\n\n/* Swipe Indicators */\n.swipe-indicators {\n  display: flex;\n  gap: 6px;\n  margin-top: 14px;\n  flex-shrink: 0;\n}\n\n.swipe-dot {\n  width: 8px;\n  height: 8px;\n  border-radius: 50%;\n  background: var(--border-default);\n  transition: background 0.2s;\n}\n\n.swipe-dot.active { background: var(--text-default); }\n.swipe-dot.done { background: var(--c-emerald-25); }\n\n/* Discover action buttons */\n.discover-actions {\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 20px;\n  padding: 12px 0 4px;\n  flex-shrink: 0;\n}\n\n.discover-action-btn {\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  border: none;\n  border-radius: 50%;\n  cursor: pointer;\n  transition: transform 0.15s, box-shadow 0.15s, background 0.15s;\n  flex-shrink: 0;\n}\n\n.discover-action-btn:active { transform: scale(0.92); }\n\n/* Pass — left, medium, red tint */\n.discover-action-btn--pass {\n  width: 52px;\n  height: 52px;\n  background: var(--bg-lowest);\n  box-shadow: 0 2px 12px rgba(231,76,60,0.2);\n  border: 2px solid var(--c-orange-10);\n  font-size: 20px;\n  color: var(--c-orange-25);\n}\n\n.discover-action-btn--pass:hover {\n  background: var(--c-orange-10);\n  box-shadow: 0 4px 16px rgba(231,76,60,0.3);\n}\n\n/* Save — centre, large, navy */\n.discover-action-btn--save {\n  width: 62px;\n  height: 62px;\n  background: var(--text-default);\n  box-shadow: 0 4px 16px rgba(26,31,58,0.25);\n  font-size: 22px;\n  color: var(--bg-lowest);\n}\n\n.discover-action-btn--save:hover {\n  background: var(--c-gray-65);\n  box-shadow: 0 6px 20px rgba(26,31,58,0.35);\n}\n\n.discover-action-btn--save.saved {\n  background: var(--c-emerald-25);\n  box-shadow: 0 4px 16px rgba(39,174,96,0.35);\n}\n\n/* Add — right, medium, green tint */\n.discover-action-btn--add {\n  width: 52px;\n  height: 52px;\n  background: var(--bg-lowest);\n  box-shadow: 0 2px 12px rgba(46,204,113,0.2);\n  border: 2px solid color-mix(in srgb, var(--c-emerald-10) 55%, white);\n  font-size: 24px;\n  font-weight: 700;\n  color: var(--c-emerald-25);\n}\n\n.discover-action-btn--add:hover {\n  background: color-mix(in srgb, var(--c-emerald-10) 55%, white);\n  box-shadow: 0 4px 16px rgba(46,204,113,0.35);\n}\n\n/* Empty State */\n.discover-empty {\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  height: 100%;\n  text-align: center;\n  gap: 12px;\n  padding: 40px 20px;\n}\n\n.discover-empty-icon {\n  width: 64px;\n  height: 64px;\n  background: color-mix(in srgb, var(--c-emerald-10) 55%, white);\n  border-radius: 50%;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  font-size: 28px;\n  color: var(--c-emerald-25);\n}\n\n.discover-empty-title {\n  font-size: 18px;\n  font-weight: 700;\n  color: var(--text-default);\n}\n\n.discover-empty-sub {\n  font-size: 13px;\n  color: var(--text-muted);\n}\n\n.discover-restart {\n  margin-top: 8px;\n  padding: 10px 24px;\n  background: var(--text-default);\n  color: var(--bg-lowest);\n  border: none;\n  border-radius: 20px;\n  font-size: 13px;\n  font-weight: 600;\n  cursor: pointer;\n}\n\n/* ── Doc Panel Tabs ── */\n.doc-tabs {\n  display: flex;\n  gap: 4px;\n}\n.doc-tab {\n  background: var(--bg-layout);\n  border: none;\n  border-radius: 8px;\n  padding: 5px 10px;\n  font-size: 12px;\n  font-weight: 600;\n  color: var(--text-muted);\n  cursor: pointer;\n  transition: all 0.15s;\n}\n.doc-tab--active {\n  background: var(--text-default);\n  color: var(--bg-lowest);\n}\n\n/* ── Why Now Section ── */\n.why-section {\n  padding: 18px 20px;\n  border-bottom: 1px solid var(--bg-layout);\n}\n.why-section:last-child { border-bottom: none; }\n\n.why-tag {\n  display: inline-block;\n  font-size: 10px;\n  font-weight: 800;\n  text-transform: uppercase;\n  letter-spacing: 0.6px;\n  padding: 3px 9px;\n  border-radius: 10px;\n  margin-bottom: 8px;\n  background: color-mix(in srgb, var(--c-blue-15) 45%, white);\n  color: var(--c-blue-30);\n}\n.why-tag--data    { background: color-mix(in srgb, var(--c-emerald-10) 55%, white); color: var(--c-emerald-25); }\n.why-tag--problem { background: var(--c-orange-10); color: var(--c-orange-25); }\n.why-tag--vision  { background: color-mix(in srgb, var(--c-purple-25) 12%, white); color: var(--c-purple-25); }\n.why-tag--nsm     { background: color-mix(in srgb, var(--c-amber-15) 45%, white); color: var(--c-amber-30); }\n\n.why-title {\n  font-size: 13px;\n  font-weight: 700;\n  color: var(--text-default);\n  margin-bottom: 8px;\n}\n\n.why-body {\n  font-size: 12px;\n  line-height: 1.6;\n  color: var(--text-subtle);\n  margin-bottom: 8px;\n}\n.why-body:last-child { margin-bottom: 0; }\n\n/* ── Bar Chart ── */\n.why-chart {\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n  margin: 12px 0 6px;\n}\n.why-chart-row {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n}\n.why-chart-label {\n  font-size: 11px;\n  font-weight: 600;\n  color: var(--text-muted);\n  width: 70px;\n  flex-shrink: 0;\n}\n.why-chart-bar-wrap {\n  flex: 1;\n  display: flex;\n  align-items: center;\n  gap: 6px;\n}\n.why-chart-bar {\n  height: 14px;\n  border-radius: 4px;\n  transition: width 0.4s ease;\n}\n.why-chart-bar--acca   { background: var(--c-blue-25); }\n.why-chart-bar--mcc    { background: var(--c-emerald-25); }\n.why-chart-bar--single { background: var(--c-red-25); }\n.why-chart-bar--bb     { background: var(--c-amber-30); }\n\n.why-chart-value {\n  font-size: 11px;\n  font-weight: 700;\n  color: var(--text-default);\n  white-space: nowrap;\n}\n.why-chart-value--up   { color: var(--c-emerald-25); }\n.why-chart-value--down { color: var(--c-red-25); }\n.why-delta {\n  font-size: 10px;\n  font-weight: 600;\n  color: var(--c-emerald-25);\n}\n.why-delta--down { color: var(--c-red-25); }\n\n.why-footnote {\n  font-size: 10px;\n  color: var(--text-muted);\n  margin-top: 4px;\n}\n\n/* ── NSM List ── */\n.why-nsm-list {\n  list-style: none;\n  padding: 0;\n  margin: 8px 0 0;\n  display: flex;\n  flex-direction: column;\n  gap: 12px;\n}\n.why-nsm-list li {\n  display: flex;\n  gap: 10px;\n  align-items: flex-start;\n}\n.why-nsm-icon {\n  font-size: 16px;\n  flex-shrink: 0;\n  margin-top: 1px;\n}\n.why-nsm-list strong {\n  display: block;\n  font-size: 12px;\n  font-weight: 700;\n  color: var(--text-default);\n  margin-bottom: 2px;\n}\n.why-nsm-list span {\n  font-size: 11px;\n  color: var(--text-muted);\n  line-height: 1.5;\n}\n\n/* ── MVP tab tags ── */\n.why-tag--mvp      { background: color-mix(in srgb, var(--c-blue-15) 40%, white); color: var(--c-blue-30); }\n.why-tag--existing { background: color-mix(in srgb, var(--c-emerald-10) 55%, white); color: var(--c-emerald-35); }\n.why-tag--openq    { background: color-mix(in srgb, var(--c-purple-25) 8%, white); color: var(--c-purple-25); }\n\n/* ── Building blocks list ── */\n.mvp-building-blocks {\n  list-style: none;\n  padding: 0;\n  margin: 10px 0 0;\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n}\n.mvp-block {\n  display: flex;\n  gap: 10px;\n  align-items: flex-start;\n  padding: 10px 12px;\n  border-radius: 8px;\n}\n.mvp-block--available { background: color-mix(in srgb, var(--c-emerald-10) 55%, white); }\n.mvp-block--partial   { background: color-mix(in srgb, var(--c-yellow-15) 45%, white); }\n.mvp-block--new       { background: #eff6ff; }\n\n.mvp-block-status {\n  font-size: 13px;\n  font-weight: 800;\n  width: 18px;\n  flex-shrink: 0;\n  margin-top: 1px;\n}\n.mvp-block--available .mvp-block-status { color: var(--c-emerald-25); }\n.mvp-block--partial   .mvp-block-status { color: var(--c-amber-30); }\n.mvp-block--new       .mvp-block-status { color: var(--c-blue-25); }\n\n.mvp-block strong {\n  display: block;\n  font-size: 12px;\n  font-weight: 700;\n  color: var(--text-default);\n  margin-bottom: 2px;\n}\n.mvp-block span {\n  font-size: 11px;\n  color: var(--text-muted);\n  line-height: 1.5;\n}\n\n/* ── Touchpoint blocks ── */\n.mvp-touchpoint {\n  background: var(--bg-low);\n  border-radius: 8px;\n  padding: 11px 13px;\n  margin-bottom: 8px;\n}\n.mvp-touchpoint:last-child { margin-bottom: 0; }\n\n.mvp-tp-header {\n  display: flex;\n  align-items: center;\n  gap: 7px;\n  margin-bottom: 7px;\n}\n.mvp-tp-icon { font-size: 14px; }\n.mvp-tp-header strong {\n  font-size: 12px;\n  font-weight: 700;\n  color: var(--text-default);\n}\n.mvp-tp-list {\n  margin: 0;\n  padding-left: 18px;\n  display: flex;\n  flex-direction: column;\n  gap: 3px;\n}\n.mvp-tp-list li {\n  font-size: 11px;\n  color: var(--text-muted);\n  line-height: 1.5;\n}\n\n/* ── Options list ── */\n.mvp-options {\n  list-style: none;\n  padding: 0;\n  margin: 10px 0 0;\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n}\n.mvp-options li {\n  display: flex;\n  gap: 10px;\n  align-items: flex-start;\n}\n.mvp-opt-label {\n  font-size: 10px;\n  font-weight: 800;\n  background: var(--text-default);\n  color: var(--bg-lowest);\n  border-radius: 6px;\n  padding: 2px 7px;\n  white-space: nowrap;\n  margin-top: 2px;\n  flex-shrink: 0;\n}\n.mvp-options strong {\n  display: block;\n  font-size: 12px;\n  font-weight: 700;\n  color: var(--text-default);\n  margin-bottom: 2px;\n}\n.mvp-options span {\n  font-size: 11px;\n  color: var(--text-muted);\n  line-height: 1.5;\n}\n\n/* ── Host page / panel separator ── */\n.prototype-layout {\n  gap: 32px;\n}\n\n.mvp-block--explore { background: color-mix(in srgb, var(--c-purple-25) 8%, white); }\n.mvp-block--explore .mvp-block-status { color: var(--c-purple-25); }\n\n/* ── Mode switch: wider for 3 tabs ── */\n.hub-mode-switch {\n  display: flex;\n}\n#btn-groups {\n  font-size: 12px;\n  white-space: nowrap;\n}\n\n/* ── Groups View ── */\n.groups-view {\n  padding: 0 0 80px;\n}\n\n.groups-section {\n  padding: 16px 16px 4px;\n  border-bottom: 1px solid var(--bg-layout);\n}\n.groups-section:last-child { border-bottom: none; }\n.groups-section--feed { padding-bottom: 16px; }\n\n.groups-section-header {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  margin-bottom: 12px;\n}\n.groups-section-title {\n  font-size: 13px;\n  font-weight: 700;\n  color: var(--text-default);\n}\n.groups-feed-members {\n  font-size: 11px;\n  color: var(--text-muted);\n}\n\n.groups-create-btn {\n  background: var(--text-default);\n  color: var(--bg-lowest);\n  border: none;\n  border-radius: 8px;\n  padding: 5px 12px;\n  font-size: 12px;\n  font-weight: 600;\n  cursor: pointer;\n}\n\n/* ── Group cards (list) ── */\n.group-card {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  padding: 11px 0;\n  border-bottom: 1px solid var(--border-subtle);\n  cursor: pointer;\n}\n.group-card:last-child { border-bottom: none; }\n\n.group-avatar {\n  width: 40px;\n  height: 40px;\n  border-radius: 12px;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  font-size: 13px;\n  font-weight: 800;\n  color: var(--bg-lowest);\n  flex-shrink: 0;\n}\n.group-avatar--blue   { background: var(--c-blue-25); }\n.group-avatar--green  { background: var(--c-emerald-25); }\n.group-avatar--orange { background: var(--c-amber-30); }\n\n.group-info {\n  flex: 1;\n  display: flex;\n  flex-direction: column;\n  gap: 2px;\n}\n.group-name {\n  font-size: 13px;\n  font-weight: 600;\n  color: var(--text-default);\n}\n.group-meta {\n  font-size: 11px;\n  color: var(--text-muted);\n}\n.group-badge {\n  background: var(--c-orange-25);\n  color: var(--bg-lowest);\n  font-size: 11px;\n  font-weight: 700;\n  border-radius: 10px;\n  padding: 2px 7px;\n  flex-shrink: 0;\n}\n\n/* ── Join row ── */\n.groups-join-row {\n  display: flex;\n  gap: 8px;\n  margin-bottom: 8px;\n}\n.groups-join-input {\n  flex: 1;\n  border: 1.5px solid var(--border-default);\n  border-radius: 10px;\n  padding: 9px 12px;\n  font-size: 12px;\n  color: var(--text-default);\n  outline: none;\n}\n.groups-join-input:focus { border-color: var(--c-blue-25); }\n.groups-join-btn {\n  background: var(--c-blue-25);\n  color: var(--bg-lowest);\n  border: none;\n  border-radius: 1
